<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Karate Win｜大会設定</title>
<!--
  Karate Win 大会設定画面 admin-tournaments.html  v1.0 (2026-11-24)
  運営と、その大会の主催道場の管理者が使う。ログインは申込管理画面（admin-entries）と同じ。

  できること
    ・大会の登録と修正（大会名・開催日・会場・主催道場）
    ・申込設定（受付の状態・受付期間・参加費の支払い方法と金額・問い合わせ先）
    ・クラスの登録（1行ずつ／ひな形から一括／他の大会からコピー）
    ・申込QRの発行（URL のコピー、PNG 保存）
    ・申込状況の確認（件数、クラス別の人数、選手の一覧。携帯番号は表示しない）

  データベース側: kw_entry_phase1_v1.sql ／ fn_v1〜fn_v4
  QRコードの作成には qrcode-generator（Kazuhiko Arase 氏、MIT ライセンス）をこのファイルに含めている。
-->
<style>
  :root{
    --bg:#0a0e1a; --bg2:#0e1424; --line:#2a3550; --line2:#3a4868;
    --txt:#e8ecf5; --txt2:#a8b5cc; --txt3:#7a88a6;
    --gold:#e8c060; --gold2:#c9a340; --blue:#6aa4f0; --red:#ff8090; --green:#58d08c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{color:var(--txt);min-height:100vh;line-height:1.6;font-size:14px;
    font-family:"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed}
  button,input,select,textarea{font:inherit;color:inherit}
  header{padding:14px 24px;background:rgba(10,14,26,.9);border-bottom:1px solid rgba(255,255,255,.08);
    display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
  .brand{font-size:17px;font-weight:900;letter-spacing:2px;color:var(--gold)}
  .tag{font-size:12px;padding:3px 10px;border-radius:100px;border:1px solid rgba(106,164,240,.4);color:var(--blue)}
  .sp{flex:1}
  .wrap{max-width:1280px;margin:0 auto;padding:20px 24px 80px;display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
  @media (max-width:900px){.wrap{grid-template-columns:1fr}}
  .card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:20px;margin-bottom:18px}
  h1{font-size:20px;font-weight:800;margin-bottom:4px}
  h2{font-size:16px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:10px}
  h3{font-size:13px;font-weight:800;color:var(--gold);letter-spacing:1px;margin:18px 0 10px}
  p.note{font-size:12px;color:var(--txt3);margin-top:4px}
  .tlist button{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid transparent;background:none;cursor:pointer;margin-bottom:4px}
  .tlist button:hover{background:rgba(255,255,255,.04)}
  .tlist button.on{background:rgba(232,192,96,.12);border-color:rgba(232,192,96,.45)}
  .tlist .nm{font-weight:700;font-size:14px}
  .tlist .sub{font-size:12px;color:var(--txt3)}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 9px;border-radius:100px;margin-left:6px;vertical-align:middle;white-space:nowrap}
  .b-draft{background:rgba(232,192,96,.15);color:var(--gold);border:1px solid rgba(232,192,96,.4)}
  .b-open{background:rgba(88,208,140,.15);color:var(--green);border:1px solid rgba(88,208,140,.4)}
  .b-closed,.b-finished,.b-none{background:rgba(255,255,255,.08);color:var(--txt3);border:1px solid rgba(255,255,255,.2)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .grid .full{grid-column:1/-1}
  @media (max-width:640px){.grid{grid-template-columns:1fr}}
  .field label,.lbl{display:block;font-size:12px;font-weight:700;color:var(--txt2);margin-bottom:5px}
  .req{color:var(--red);font-size:11px;margin-left:6px}
  input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=datetime-local],input[type=number],select{
    width:100%;height:42px;padding:0 12px;background:#0a1020;border:1px solid var(--line2);border-radius:8px;color-scheme:dark}
  input:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,192,96,.2)}
  .radio{display:flex;gap:18px;flex-wrap:wrap;min-height:42px;align-items:center}
  .radio label{display:flex;gap:6px;align-items:center;cursor:pointer;font-size:14px;color:var(--txt);font-weight:400;margin:0}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:9px;font-weight:800;border:none;cursor:pointer;font-size:13px}
  .btn.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1208}
  .btn.ghost{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.18);color:var(--txt)}
  .btn.danger{background:rgba(255,128,144,.12);border:1px solid rgba(255,128,144,.4);color:var(--red)}
  .btn.full{width:100%}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
  table{width:100%;border-collapse:collapse}
  th,td{padding:8px 8px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px;vertical-align:middle}
  th{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:1px;white-space:nowrap}
  td input,td select{height:36px;padding:0 8px}
  td.num,th.num{text-align:right}
  .scroll{overflow-x:auto}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:14px}
  .stat{padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.02)}
  .stat .l{font-size:11px;color:var(--txt3);font-weight:700}
  .stat .v{font-size:24px;font-weight:900;line-height:1.2}
  .qr{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
  .qr canvas{background:#fff;border-radius:8px;width:200px;height:200px}
  .url{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;word-break:break-all;padding:10px 12px;background:#0a1020;border:1px solid var(--line2);border-radius:8px}
  .notice{border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px}
  .notice.info{background:rgba(106,164,240,.1);border:1px solid rgba(106,164,240,.35);color:#bcd6fb}
  .notice.warn{background:rgba(232,192,96,.1);border:1px solid rgba(232,192,96,.4);color:var(--gold)}
  .notice.err{background:rgba(255,128,144,.1);border:1px solid rgba(255,128,144,.4);color:var(--red)}
  .login{max-width:400px;margin:60px auto;padding:0 20px}
  .login .field{margin-bottom:14px}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}
  #modal.on{display:flex}
  #modal .box{width:100%;max-width:480px;background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:22px}
  #toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:rgba(20,40,70,.97);border:1px solid var(--green);color:#b8f5d0;
    padding:10px 22px;border-radius:100px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9500;max-width:90vw}
  #toast.on{opacity:1}
  #toast.ng{border-color:var(--red);color:#ffc0c8}
  .muted{color:var(--txt3)}
</style>
</head>
<body>
<header>
  <div class="brand">KARATE WIN</div><span class="tag">大会設定</span><div class="sp"></div>
  <span id="who" class="muted" style="font-size:12px"></span>
  <button class="btn ghost" id="logout" style="display:none">ログアウト</button>
</header>

<div class="login" id="v-login" style="display:none">
  <div class="card">
    <h1>運営者ログイン</h1><p class="note" style="margin-bottom:18px">大会の登録と申込設定にはログインが必要です。</p>
    <div class="field"><label for="l-email">メールアドレス</label><input type="email" id="l-email" autocomplete="email" /></div>
    <div class="field"><label for="l-pass">パスワード</label><input type="password" id="l-pass" autocomplete="current-password" /></div>
    <div id="l-msg"></div>
    <button class="btn primary full" id="l-go">ログイン</button>
  </div>
</div>

<div class="wrap" id="v-main" style="display:none">
  <aside>
    <div class="card">
      <button class="btn primary full" id="new">＋ 新しい大会を登録</button>
      <h3>大会一覧</h3>
      <div class="tlist" id="tlist"></div>
    </div>
  </aside>
  <section id="detail"></section>
</div>

<div id="modal"><div class="box" id="modal-box"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php

// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const GRADES = ['', '小学1年', '小学2年', '小学3年', '小学4年', '小学5年', '小学6年', '中学1年', '中学2年', '中学3年', '高校1年', '高校2年', '高校3年'];
const STATUS = { draft: '下書き', open: '受付中', closed: '締切', finished: '終了' };
const EVENT = { kumite: '組手', kata: '形' };
const yen = (n) => '¥' + Number(n || 0).toLocaleString('ja-JP');

function toast(msg, ng) { const t = $('toast'); t.textContent = msg; t.className = 'on' + (ng ? ' ng' : ''); clearTimeout(t._h); t._h = setTimeout(() => { t.className = ''; }, 3500); }
function showModal(html) { $('modal-box').innerHTML = html; $('modal').classList.add('on'); }
function hideModal() { $('modal').classList.remove('on'); }
function errText(e) { return (e && (e.message || e.details)) || String(e); }
// 日時の入力欄（日本時間）⇔ データベースの日時
function toLocalInput(iso) {
  if (!iso) return '';
  const p = Object.fromEntries(new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date(iso)).map((x) => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}T${p.hour === '24' ? '00' : p.hour}:${p.minute}`;
}
const fromLocalInput = (v) => v ? v + ':00+09:00' : null;
const entryBase = () => { try { return localStorage.getItem('kw_entry_base') || new URL('entry.html', location.href).href; } catch (e) { return 'entry.html'; } };

async function init() {
  try {
    sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
    const { data: { session } } = await sb.auth.getSession();
    if (session) { user = session.user; await showMain(); } else showLogin();
    sb.auth.onAuthStateChange((ev, s) => {
      if (ev === 'SIGNED_IN' && s && !user) { user = s.user; showMain(); }
      else if (ev === 'SIGNED_OUT') { user = null; showLogin(); }
    });
  } catch (e) { toast('初期化エラー: ' + errText(e), true); }
}
function showLogin() { $('v-login').style.display = ''; $('v-main').style.display = 'none'; $('logout').style.display = 'none'; $('who').textContent = ''; }
async function showMain() {
  $('v-login').style.display = 'none'; $('v-main').style.display = ''; $('logout').style.display = ''; $('who').textContent = user?.email || '';
  await loadAll(); renderDetail();
}
$('l-go').onclick = async () => {
  const email = $('l-email').value.trim(), password = $('l-pass').value;
  if (!email || !password) { $('l-msg').innerHTML = '<div class="notice err">メールアドレスとパスワードを入力してください</div>'; return; }
  $('l-go').disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  $('l-go').disabled = false;
  if (error) $('l-msg').innerHTML = `<div class="notice err">${esc(/Invalid login/.test(error.message) ? 'メールアドレスまたはパスワードが違います' : error.message)}</div>`;
};
$('l-pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('l-go').click(); });
$('logout').onclick = async () => { await sb.auth.signOut(); };

async function loadAll() {
  const [t, s, d] = await Promise.all([
    sb.from('tournaments').select('id,name,date_start,date_end,venue,organizer_dojo_id,is_public').order('date_start', { ascending: false, nullsFirst: false }),
    sb.from('kw_entry_settings').select('*'),
    sb.from('dojos').select('id,name').order('name')
  ]);
  if (t.error) toast('大会の読み込みに失敗: ' + errText(t.error), true);
  if (s.error) toast('申込設定の読み込みに失敗: ' + errText(s.error), true);
  T = t.data || []; DOJOS = d.data || []; SET = {};
  (s.data || []).forEach((x) => { SET[x.tournament_id] = x; });
  renderList();
}
function renderList() {
  $('tlist').innerHTML = T.length ? T.map((t) => {
    const st = SET[t.id] ? SET[t.id].entry_status : 'none';
    return `<button data-id="${esc(t.id)}" class="${cur === t.id ? 'on' : ''}"><div class="nm">${esc(t.name)}</div>
      <div class="sub">${esc(t.date_start || '開催日未定')}<span class="badge b-${st}">${st === 'none' ? '申込設定なし' : STATUS[st]}</span></div></button>`;
  }).join('') : '<p class="note">大会がまだありません。</p>';
  $('tlist').querySelectorAll('button').forEach((b) => { b.onclick = () => select(b.dataset.id); });
}
async function select(id) {
  cur = id; CLS = []; SUM = null; renderList();
  if (id && id !== 'new') {
    const c = await sb.from('kw_classes').select('*').eq('tournament_id', id).order('sort_order').order('name');
    if (c.error) toast('クラスの読み込みに失敗: ' + errText(c.error), true);
    CLS = (c.data || []).map((x) => ({ ...x, _saved: true }));
  }
  renderDetail();
  if (id && id !== 'new' && SET[id]) loadSummary();
}
$('new').onclick = () => select('new');

      <div class="field"><label for="t-venue">会場<span class="req">必須</span></label><input type="text" id="t-venue" maxlength="100" placeholder="2会場の場合は両方の会場名" value="${esc(t.venue || '')}" /></div>
      <div class="field"><label for="t-dojo">主催道場</label>

        <p class="note">主催道場の管理者は、この大会の設定と申込を扱えます（大会事務局）。</p></div>

    <h3>申込の受付</h3>

      <div class="field"><label for="s-status">受付の状態</label>

      <div class="field"><label for="s-contact">事務局の連絡先</label><input type="text" id="s-contact" maxlength="100" placeholder="例: 大会事務局 075-000-0000" value="${esc(s.office_contact || '')}" /></div>
      <div class="field"><label for="s-open">申込開始日時</label><input type="datetime-local" id="s-open" value="${esc(toLocalInput(s.entry_open_at))}" /></div>
      <div class="field"><label for="s-close">申込締切日時</label><input type="datetime-local" id="s-close" value="${esc(toLocalInput(s.entry_close_at))}" /></div>
    </div>

    <h3>参加費</h3>
    <div class="grid">
      <div class="field full"><span class="lbl">支払い方法</span>
        <div class="radio"><label><input type="radio" name="pay" value="none" ${s.payment_mode !== 'card' ? 'checked' : ''} /> カード払いなし（従来どおり別途集金）</label>
          <label><input type="radio" name="pay" value="card" ${s.payment_mode === 'card' ? 'checked' : ''} /> カード払いあり</label></div></div>

  </div>

  drawFee();
  document.querySelectorAll('input[name=pay]').forEach((r) => { r.onchange = drawFee; });
  if ($('cancel-new')) $('cancel-new').onclick = () => select(null);
  $('save').onclick = saveTournament;
  if (!isNew) { renderClasses(); renderQr(); renderSummary(); }

async function saveTournament() {
  const isNew = cur === 'new', msg = (m) => { $('save-msg').innerHTML = m ? `<div class="notice err">${esc(m)}</div>` : ''; };
  const name = $('t-name').value.trim(), date = $('t-date').value, dateEnd = $('t-date-end').value, venue = $('t-venue').value.trim();
  const status = $('s-status').value, pay = document.querySelector('input[name=pay]:checked').value;
  const feeMode = pay === 'card' ? document.querySelector('input[name=feemode]:checked').value : 'by_count';
  const num = (id) => ($(id) && $(id).value !== '' ? Math.round(Number($(id).value)) : null);
  const fee1 = pay === 'card' ? num('s-fee1') : null, fee2 = pay === 'card' && feeMode === 'by_count' ? num('s-fee2') : null;
  const openAt = fromLocalInput($('s-open').value), closeAt = fromLocalInput($('s-close').value);
  msg('');
  if (!name) return msg('大会名を入力してください');
  if (!date) return msg('開催日を入力してください');
  if (dateEnd && dateEnd < date) return msg('終了日は開催日より後にしてください');
  if (!venue) return msg('会場を入力してください');
  if (openAt && closeAt && $('s-open').value >= $('s-close').value) return msg('申込締切は、申込開始より後にしてください');
  if (pay === 'card' && (fee1 == null || fee1 < 0 || Number.isNaN(fee1))) return msg('参加費の金額を入力してください');
  if (pay === 'card' && feeMode === 'by_count' && (fee2 == null || fee2 < 0 || Number.isNaN(fee2))) return msg('2種目の金額を入力してください');
  if (status === 'open') {
    if (!closeAt) return msg('受付中にするには、申込締切日時を入力してください');
    if (!CLS.some((c) => c._saved && c.is_open && !c.split_from)) return msg('受付中にするには、先にクラスを1つ以上登録して保存してください（いったん下書きで保存 → クラスを登録）');
    const was = SET[cur] ? SET[cur].entry_status : 'draft';
    if (was !== 'open' && !(await confirmBox('受付を開始します', '受付中にすると、申込アプリで父兄の携帯に実際のSMSが送られます。QRを配布する準備ができていれば進めてください。', '受付中にする'))) return;
  }
  $('save').disabled = true;
  try {
    const tp = { name, date_start: date, date_end: dateEnd || null, venue, organizer_dojo_id: $('t-dojo').value || null, is_public: $('t-public').checked };
    let id = cur;
    if (isNew) {
      const r = await sb.from('tournaments').insert({ ...tp, created_by: user.id }).select('id').single();
      if (r.error) throw r.error; id = r.data.id;
    } else {
      const r = await sb.from('tournaments').update(tp).eq('id', id);
      if (r.error) throw r.error;
    }
    const sp = { tournament_id: id, entry_status: status, entry_open_at: openAt, entry_close_at: closeAt, start_time: $('s-time').value || null,
                 payment_mode: pay, fee_mode: feeMode, fee_single: fee1, fee_double: fee2, office_contact: $('s-contact').value.trim() || null };
    const r2 = await sb.from('kw_entry_settings').upsert(sp, { onConflict: 'tournament_id' });
    if (r2.error) throw r2.error;
    await loadAll(); await select(id); toast(isNew ? '大会を登録しました。続けてクラスを登録してください' : '保存しました');
  } catch (e) {
    msg('保存できませんでした: ' + errText(e) + (/row-level security|permission/i.test(errText(e)) ? '（この大会を編集する権限がありません）' : ''));
  } finally { if ($('save')) $('save').disabled = false; }
}
function confirmBox(title, text, okLabel) {
  return new Promise((res) => {
    showModal(`<h2>${esc(title)}</h2><p style="margin-bottom:18px;color:var(--txt2)">${esc(text)}</p>
      <div class="bar"><button class="btn primary" id="m-ok">${esc(okLabel)}</button><button class="btn ghost" id="m-no">やめる</button></div>`);
    $('m-ok').onclick = () => { hideModal(); res(true); }; $('m-no').onclick = () => { hideModal(); res(false); };
  });
}

// ══════════════════════════════════════════════
function readClasses() {
  document.querySelectorAll('#cls-body tr[data-i]').forEach((tr) => {
    const c = CLS[+tr.dataset.i]; if (!c || c.split_from) return;
    const v = (k) => tr.querySelector(`[data-k=${k}]`);
    c.name = v('name').value.trim(); c.event = v('event').value; c.gender = v('gender').value;
    c.grade_from = v('gf').value ? +v('gf').value : null; c.grade_to = v('gt').value ? +v('gt').value : null;
    c.sort_order = +v('ord').value || 0; c.is_open = v('open').checked;
  });
}
function renderClasses() {
  const gsel = (k, val) => `<select data-k="${k}">${GRADES.map((g, i) => `<option value="${i || ''}" ${(val || 0) === i ? 'selected' : ''}>${i ? g : '指定なし'}</option>`).join('')}</select>`;
  const others = T.filter((t) => t.id !== cur);
  const cnt = (id) => { const x = SUM && SUM.classes.find((c) => c.id === id); return x ? x.count : ''; };
  $('c-classes').innerHTML = `<h2>クラス<span class="muted" style="font-size:12px;font-weight:400">父兄が申込時に選ぶ区分です。A・B などへの分割は、締切後に編成画面で行います。</span></h2>
    <div class="scroll"><table><thead><tr><th style="min-width:170px">クラス名</th><th>種目</th><th>学年（から）</th><th>学年（まで）</th><th>性別</th><th>表示順</th><th>受付</th><th class="num">申込</th><th></th></tr></thead>
    <tbody id="cls-body">${CLS.length ? CLS.map((c, i) => c.split_from ? `<tr><td>${esc(c.name)} <span class="badge b-none">分割</span></td><td>${EVENT[c.event]}</td><td colspan="5" class="muted">編成で作られたクラス</td><td class="num">${cnt(c.id)}</td><td></td></tr>` : `<tr data-i="${i}">
      <td><input type="text" data-k="name" maxlength="40" value="${esc(c.name)}" /></td>
      <td><select data-k="event"><option value="kumite" ${c.event === 'kumite' ? 'selected' : ''}>組手</option><option value="kata" ${c.event === 'kata' ? 'selected' : ''}>形</option></select></td>
      <td>${gsel('gf', c.grade_from)}</td><td>${gsel('gt', c.grade_to)}</td>
      <td><select data-k="gender">${['男子', '女子', '混合'].map((g) => `<option ${c.gender === g ? 'selected' : ''}>${g}</option>`).join('')}</select></td>
      <td><input type="number" data-k="ord" style="width:70px" value="${esc(c.sort_order ?? 0)}" /></td>
      <td><input type="checkbox" data-k="open" ${c.is_open !== false ? 'checked' : ''} /></td>
      <td class="num">${c._saved ? cnt(c.id) : '<span class="muted">未保存</span>'}</td>
      <td><button class="btn danger" data-del="${i}" style="padding:6px 10px">削除</button></td></tr>`).join('') : '<tr><td colspan="9" class="muted">クラスがまだありません。下のボタンから追加してください。</td></tr>'}</tbody></table></div>
    <div id="cls-msg" style="margin-top:12px"></div>
    <div class="bar"><button class="btn ghost" id="cls-add">＋ 1行追加</button><button class="btn ghost" id="cls-tpl">学年別のひな形から作る</button>
      ${others.length ? `<select id="cls-from" style="width:auto;max-width:240px"><option value="">他の大会からコピー…</option>${others.map((t) => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('')}</select>` : ''}
      <div class="sp"></div><button class="btn primary" id="cls-save">クラスを保存</button></div>`;
  $('cls-add').onclick = () => { readClasses(); CLS.push({ id: crypto.randomUUID(), tournament_id: cur, name: '', event: 'kumite', grade_from: null, grade_to: null, gender: '男子', sort_order: (CLS.length + 1) * 10, is_open: true }); renderClasses(); };
  $('cls-tpl').onclick = templateBox;
  $('cls-save').onclick = saveClasses;
  if ($('cls-from')) $('cls-from').onchange = copyClasses;
  document.querySelectorAll('[data-del]').forEach((b) => { b.onclick = () => deleteClass(+b.dataset.del); });
}
async function saveClasses() {
  readClasses();
  const rows = CLS.filter((c) => !c.split_from), m = (t) => { $('cls-msg').innerHTML = t ? `<div class="notice err">${esc(t)}</div>` : ''; };
  m('');
  if (rows.some((c) => !c.name)) return m('クラス名が空の行があります');
  if (rows.some((c) => c.grade_from && c.grade_to && c.grade_from > c.grade_to)) return m('学年の「から」が「まで」より後になっている行があります');
  const keys = rows.map((c) => c.event + '|' + c.name);
  if (new Set(keys).size !== keys.length) return m('同じ種目・同じ名前のクラスが重なっています');
  if (!rows.length) return toast('保存するクラスがありません', true);
  $('cls-save').disabled = true;
  const r = await sb.from('kw_classes').upsert(rows.map((c) => ({ id: c.id, tournament_id: cur, name: c.name, event: c.event, grade_from: c.grade_from, grade_to: c.grade_to, gender: c.gender, sort_order: c.sort_order, is_open: c.is_open })));
  if (r.error) { $('cls-save').disabled = false; return m('保存できませんでした: ' + errText(r.error)); }
  await select(cur); toast('クラスを保存しました');
}
async function deleteClass(i) {
  readClasses(); const c = CLS[i];
  if (!c._saved) { CLS.splice(i, 1); renderClasses(); return; }
  if (!(await confirmBox('クラスの削除', `「${c.name}（${EVENT[c.event]}）」を削除します。`, '削除する'))) return;
  const r = await sb.from('kw_classes').delete().eq('id', c.id);
  if (r.error) { $('cls-msg').innerHTML = `<div class="notice err">${esc(r.error.code === '23503' || /foreign key/i.test(errText(r.error)) ? 'このクラスには申込が入っているため削除できません。「受付」のチェックを外して保存すると、申込アプリに出なくなります。' : '削除できませんでした: ' + errText(r.error))}</div>`; return; }
  CLS.splice(i, 1); renderClasses(); toast('削除しました');
}
async function copyClasses() {
  const from = $('cls-from').value; if (!from) return;
  const r = await sb.rpc('kw_entry_copy_classes', { p_from: from, p_to: cur });
  if (r.error || !r.data?.ok) { toast('コピーできませんでした: ' + (r.error ? errText(r.error) : r.data?.code), true); return; }
  await select(cur); toast(`${r.data.copied}件のクラスをコピーしました`);
}
function templateBox() {
  readClasses();
  const g = (id, def) => `<select id="${id}">${GRADES.slice(1).map((x, i) => `<option value="${i + 1}" ${i + 1 === def ? 'selected' : ''}>${x}</option>`).join('')}</select>`;
  showModal(`<h2>学年別のひな形から作る</h2><p class="note" style="margin-bottom:14px">学年ごとのクラスをまとめて作ります。作ったあと、名前や学年は表で直せます。</p>
    <div class="grid"><div class="field"><label>学年（から）</label>${g('tp-from', 1)}</div><div class="field"><label>学年（まで）</label>${g('tp-to', 6)}</div>
      <div class="field"><span class="lbl">性別</span><div class="radio"><label><input type="radio" name="tp-g" value="split" checked /> 男女別</label><label><input type="radio" name="tp-g" value="mix" /> 混合</label></div></div>
      <div class="field"><span class="lbl">種目</span><div class="radio"><label><input type="checkbox" id="tp-kumite" checked /> 組手</label><label><input type="checkbox" id="tp-kata" checked /> 形</label></div></div></div>
    <div class="bar"><button class="btn primary" id="tp-ok">表に追加する</button><button class="btn ghost" id="tp-no">やめる</button></div>`);
  $('tp-no').onclick = hideModal;
  $('tp-ok').onclick = () => {
    const a = +$('tp-from').value, b = +$('tp-to').value, split = document.querySelector('input[name=tp-g]:checked').value === 'split';
    const evs = [$('tp-kumite').checked && 'kumite', $('tp-kata').checked && 'kata'].filter(Boolean);
    let ord = CLS.reduce((m, c) => Math.max(m, c.sort_order || 0), 0), added = 0;
    for (let n = Math.min(a, b); n <= Math.max(a, b); n++) for (const gen of (split ? ['男子', '女子'] : ['混合'])) for (const ev of evs) {
      const name = GRADES[n] + (split ? gen : '');
      if (CLS.some((c) => c.event === ev && c.name === name)) continue;
      ord += 10; added++;
      CLS.push({ id: crypto.randomUUID(), tournament_id: cur, name, event: ev, grade_from: n, grade_to: n, gender: gen, sort_order: ord, is_open: true });
    }
    hideModal(); renderClasses(); toast(added ? `${added}件を表に追加しました。「クラスを保存」で確定します` : '追加するクラスはありませんでした');
  };
}

// ══════════════════════════════════════════════
//  申込QR
// ══════════════════════════════════════════════
function renderQr() {
  const s = SET[cur];
  if (!s) { $('c-qr').innerHTML = '<h2>申込QR</h2><p class="note">大会と申込設定を保存すると、申込QRが発行されます。</p>'; return; }
  const url = entryBase() + (entryBase().includes('?') ? '&' : '?') + 't=' + encodeURIComponent(s.entry_code);
  $('c-qr').innerHTML = `<h2>申込QR<span class="badge b-${s.entry_status}">${STATUS[s.entry_status]}</span></h2>
    ${s.entry_status === 'draft' ? '<div class="notice warn">いまは「下書き」です。このQRで開くと動作確認モードになり、SMSは送られません。</div>' : ''}
    <div class="qr"><canvas id="qr" width="600" height="600"></canvas>
      <div style="flex:1;min-width:260px">
        <span class="lbl">申込ページのURL</span><div class="url" id="qr-url">${esc(url)}</div>
        <div class="bar"><button class="btn ghost" id="qr-copy">URLをコピー</button><button class="btn ghost" id="qr-png">QRをPNGで保存</button><a class="btn ghost" href="${esc(url)}" target="_blank" rel="noopener" style="text-decoration:none">申込ページを開く</a></div>
        <div class="field" style="margin-top:16px"><label for="qr-base">申込アプリ（entry.html）の置き場所</label><input type="text" id="qr-base" value="${esc(entryBase())}" />
          <p class="note">申込アプリを別の場所に置いた場合は、そのURLに書き換えてください（このブラウザに保存されます）。</p></div>
        <p class="note">申込コード: ${esc(s.entry_code)}</p>
      </div></div>`;
  drawQr(url);
  $('qr-copy').onclick = async () => { try { await navigator.clipboard.writeText(url); toast('URLをコピーしました'); } catch (e) { toast('コピーできませんでした。URLを選択してコピーしてください', true); } };
  $('qr-png').onclick = () => { const a = document.createElement('a'); a.href = $('qr').toDataURL('image/png'); a.download = `申込QR_${(T.find((t) => t.id === cur) || {}).name || ''}.png`.replace(/[\\/:*?"<>|\s]+/g, '_'); document.body.appendChild(a); a.click(); a.remove(); };
  $('qr-base').onchange = () => { try { const v = $('qr-base').value.trim(); if (v) localStorage.setItem('kw_entry_base', v); else localStorage.removeItem('kw_entry_base'); } catch (e) {} renderQr(); };
}
function drawQr(text) {
  const cv = $('qr'); let ctx = null; try { ctx = cv.getContext('2d'); } catch (e) {}
  if (!ctx) return;
  const qr = qrcode(0, 'M'); qr.addData(text); qr.make();
  const n = qr.getModuleCount(), quiet = 4, cell = Math.floor(cv.width / (n + quiet * 2)), off = Math.floor((cv.width - cell * n) / 2);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) ctx.fillRect(off + c * cell, off + r * cell, cell, cell);
}

// ══════════════════════════════════════════════
//  申込状況
// ══════════════════════════════════════════════
async function loadSummary() {
  const id = cur, r = await sb.rpc('kw_entry_admin_summary', { p_tournament: id });
  if (cur !== id) return;
  SUM = (!r.error && r.data && r.data.ok) ? r.data : null;
  if (r.error || !SUM) toast('申込状況の読み込みに失敗: ' + (r.error ? errText(r.error) : (r.data && r.data.code)), true);
  renderSummary(); readClasses(); renderClasses();
}
function renderSummary() {
  if (!SET[cur]) { $('c-sum').innerHTML = '<h2>申込状況</h2><p class="note">申込設定を保存すると表示されます。</p>'; return; }
  if (!SUM) { $('c-sum').innerHTML = '<h2>申込状況</h2><p class="note">読み込んでいます…</p>'; return; }
  const c = SUM.counts, card = SET[cur].payment_mode === 'card';
  const st = (e) => e.status === 'cancelled' ? '<span class="badge b-none">取消</span>' : e.status === 'excluded' ? '<span class="badge b-none">除外</span>' : '<span class="badge b-open">申込済み</span>';
  const pay = (e) => e.status !== 'applied' ? '' : e.payment_status === 'paid' ? `<span class="badge b-open">支払い済み</span>` : e.payment_status === 'pending' ? '<span class="badge b-draft">支払い待ち</span>' : '';
  const src = { parent: '父兄', dojo_bulk: '道場一括', legacy: '旧フォーム' };
  $('c-sum').innerHTML = `<h2>申込状況<button class="btn ghost" id="sum-reload" style="margin-left:auto;padding:6px 14px">更新</button></h2>
    <div class="stats"><div class="stat"><div class="l">申込済み</div><div class="v">${c.applied}</div></div>
      <div class="stat"><div class="l">取消</div><div class="v">${c.cancelled}</div></div>
      ${card ? `<div class="stat"><div class="l">支払い待ち</div><div class="v" style="color:var(--gold)">${c.pending}</div></div>
      <div class="stat"><div class="l">支払い済み</div><div class="v" style="color:var(--green)">${c.paid}</div></div>
      <div class="stat"><div class="l">入金合計</div><div class="v" style="font-size:18px">${esc(yen(c.paid_total))}</div></div>` : ''}</div>
    <div class="scroll"><table><thead><tr><th>選手</th><th>学年</th><th>性別</th><th>所属</th><th>種目とクラス</th><th>経路</th><th>状態</th><th>申込日時</th></tr></thead><tbody>
    ${SUM.entries.length ? SUM.entries.map((e) => `<tr><td><b>${esc(e.player_name)}</b><br><span class="muted" style="font-size:11px">${esc(e.player_kana)}</span></td>
      <td>${esc(e.grade)}</td><td>${esc(e.gender)}</td><td>${esc(e.affiliation || '')}</td>
      <td>${e.events.map((x) => esc(EVENT[x.event] + '：' + x.class_name)).join('<br>')}</td>
      <td>${esc(src[e.source] || e.source)}${e.source !== 'legacy' ? (e.verified ? '' : '<br><span class="muted" style="font-size:11px">SMS未認証</span>') : ''}</td>
      <td>${st(e)}${pay(e)}</td><td class="muted">${esc(toLocalInput(e.created_at).replace('T', ' '))}</td></tr>`).join('') : '<tr><td colspan="8" class="muted">まだ申込がありません。</td></tr>'}
    </tbody></table></div><p class="note">保護者の携帯番号はこの画面には表示しません。修正・除外・編成は、第2段階の編成画面で行います。</p>`;
  $('sum-reload').onclick = loadSummary;
}

$('modal').addEventListener('click', (e) => { if (e.target === $('modal')) hideModal(); });
init();
</script>
