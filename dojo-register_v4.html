<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>道場会員登録 | Karate Win</title>
<style>
  *{box-sizing:border-box;}
  :root{
    --bg:#f3f5f8; --card:#ffffff; --line:#d5dbe5; --line2:#9aa5b8;
    --text:#111827; --sub:#374151; --muted:#4b5563;
    --navy:#163a6b; --navy2:#0f2b52; --navy-soft:#e7eef8;
    --err:#b42318; --err-bg:#fef3f2; --err-line:#f3b4ae;
    --ok:#05603a; --ok-bg:#ecfdf3; --ok-line:#a6e3c1;
    --info:#1e3a6b; --info-bg:#eef4fb; --info-line:#bcd0ea;
  }
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Yu Gothic","YuGothic","Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;font-size:16px;line-height:1.75;font-weight:500;-webkit-text-size-adjust:100%;}
  .top{background:#fff;border-bottom:1px solid var(--line);}
  .top-in{max-width:600px;margin:0 auto;padding:12px 16px;display:flex;align-items:baseline;gap:10px;}
  .top .logo{font-size:19px;font-weight:800;color:var(--navy2);letter-spacing:1px;}
  .top .sub{font-size:14px;color:var(--sub);font-weight:700;}
  .wrap{max-width:600px;margin:0 auto;padding:18px 16px 56px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;}
  .hero{padding:18px 20px;margin-bottom:16px;}
  .hero h1{margin:0 0 4px;font-size:20px;font-weight:800;color:var(--text);}
  .hero .price{font-size:15px;color:var(--sub);font-weight:700;}
  .hero .price b{font-size:28px;color:var(--navy2);font-weight:800;margin-right:2px;}
  .hero ul{margin:12px 0 0;padding:0;list-style:none;font-size:15px;color:var(--text);}
  .hero li{padding:4px 0 4px 26px;position:relative;line-height:1.6;}
  .hero li::before{content:"✓";position:absolute;left:2px;top:4px;color:var(--ok);font-weight:900;}
  .panel-head{padding:14px 20px;border-bottom:1px solid var(--line);font-size:18px;font-weight:800;color:var(--text);}
  #kw-dr-stepbar{display:flex;gap:6px;padding:14px 20px 0;}
  .step{flex:1;text-align:center;padding:6px 2px;border-radius:8px;font-size:13px;font-weight:800;line-height:1.4;border:1px solid var(--line);background:#f1f3f6;color:#4b5563;}
  .step.done{background:var(--navy-soft);color:var(--navy2);border-color:#b7c8e2;}
  .step.cur{background:var(--navy);color:#fff;border-color:var(--navy);}
  #kw-dr-body{padding:16px 20px 22px;min-height:120px;}
  .loading{text-align:center;padding:24px 0;color:var(--sub);font-weight:700;}
  .tabs{display:flex;gap:8px;margin-bottom:6px;}
  .tab{flex:1;height:44px;border-radius:8px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;border:2px solid var(--line2);background:#fff;color:var(--sub);}
  .tab.on{border-color:var(--navy);background:var(--navy);color:#fff;}
  label.f{display:block;font-size:15px;font-weight:800;color:var(--text);margin:16px 0 6px;}
  label.f .opt{font-weight:700;color:var(--muted);font-size:14px;}
  input.i, select.i{width:100%;height:50px;border-radius:8px;border:2px solid var(--line2);background:#fff;color:var(--text);padding:0 12px;font-size:16px;font-family:inherit;font-weight:600;}
  input.i:focus, select.i:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(22,58,107,.18);}
  .btn{display:block;width:100%;height:52px;border-radius:8px;font-family:inherit;font-weight:800;font-size:17px;cursor:pointer;margin-top:18px;letter-spacing:.5px;}
  .btn.main{border:none;background:var(--navy);color:#fff;}
  .btn.main:active{background:var(--navy2);}
  .btn.sub{height:48px;font-size:15px;margin-top:10px;border:2px solid var(--line2);background:#fff;color:var(--navy2);}
  .btn.link{height:auto;margin-top:12px;border:none;background:none;color:var(--navy);font-size:15px;text-decoration:underline;padding:4px 0;}
  .msg{margin-top:12px;font-size:15px;font-weight:700;white-space:pre-wrap;line-height:1.65;border-radius:8px;}
  .msg:empty{display:none;}
  .msg.err{color:var(--err);background:var(--err-bg);border:1px solid var(--err-line);padding:10px 12px;}
  .msg.ok{color:var(--ok);background:var(--ok-bg);border:1px solid var(--ok-line);padding:10px 12px;}
  .msg.info{color:var(--info);background:var(--info-bg);border:1px solid var(--info-line);padding:10px 12px;}
  .note{margin-top:14px;font-size:14px;color:var(--sub);line-height:1.7;font-weight:500;}
  .who{font-size:15px;color:var(--sub);background:#f6f8fb;border:1px solid var(--line);border-radius:8px;padding:8px 12px;}
  .who b{color:var(--text);word-break:break-all;}
  .box{background:#f6f8fb;border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
  .plan-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .plan-name{font-size:16px;font-weight:800;color:var(--text);}
  .plan-price{font-size:24px;font-weight:800;color:var(--navy2);}
  .plan-price small{font-size:14px;color:var(--sub);font-weight:700;}
  .done-title{text-align:center;font-size:20px;font-weight:800;color:var(--ok);margin:4px 0 8px;}
  .center{text-align:center;}
  .dojo{background:#fff;border:2px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:12px;}
  .dojo .nm{font-size:18px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:8px;}
  .badge{font-size:13px;font-weight:800;padding:2px 10px;border-radius:12px;background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line);}
  .code-lbl{font-size:14px;font-weight:800;color:var(--sub);margin-top:8px;}
  .code{font-size:32px;font-weight:800;color:var(--text);letter-spacing:6px;font-variant-numeric:tabular-nums;line-height:1.3;}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .mini{padding:8px 14px;border-radius:8px;border:2px solid var(--line2);background:#fff;color:var(--navy2);font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;}
  .dojo .id{font-size:14px;color:var(--sub);margin-top:6px;word-break:break-all;}
  .steps-box{margin-top:14px;background:var(--info-bg);border:1px solid var(--info-line);border-radius:10px;padding:14px 16px;font-size:15px;color:var(--text);line-height:1.75;}
  .steps-box .h{font-weight:800;color:var(--info);margin-bottom:4px;}
  .steps-box ol{margin:0;padding-left:1.4em;}
  .steps-box li{margin:4px 0;}
  .big-ico{text-align:center;font-size:40px;line-height:1.2;margin-top:4px;}
  .foot{margin-top:18px;font-size:14px;color:var(--sub);line-height:1.8;}
  a{color:var(--navy);font-weight:800;}
</style>
</head>
<body>
<div class="top"><div class="top-in"><div class="logo">Karate Win</div><div class="sub">道場会員登録</div></div></div>
<div class="wrap">
  <div class="card hero">
    <h1>道場会員プラン</h1>
    <div class="price"><b>¥3,300</b>/月（税込）・毎月自動更新</div>
    <ul>
      <li>道場の登録と、父兄・選手向け招待コードの発行</li>
      <li>大会運営アプリ「Karate Win」での試合運営・動画記録</li>
      <li>道場の試合動画の管理</li>
      <li>父兄・選手は招待コードで観戦アプリに参加し、自分の道場の動画を見られます</li>
    </ul>
  </div>

  <div class="card">
    <div class="panel-head">登録手続き</div>
    <div id="dr-root">
      <div id="kw-dr-stepbar"></div>
      <div id="kw-dr-body"><div class="loading">読み込み中…</div></div>
    </div>
  </div>

  <div class="foot">
    契約は毎月自動で更新されます。解約はいつでもできます。<br>
    アカウントは観戦アプリ・カメラアプリと共通です。<br>
    わからないことは運営までお問い合わせください。
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
// ══════════════════════════════════════════════════════════════
//  道場会員登録ウィザード（独立ページ版 v4）
//  v4: 白地・濃い文字のデザインに全面変更（スタイルをクラス化）
//      確認メールのリンク先をこのページにする（emailRedirectTo）。
//      指定しないと Supabase の Site URL（観客アプリ）に飛ぶため。
//      メールから戻ったら確認完了を表示して道場情報（S5）へ進む。
//      ログイン中のアカウントを切り替えるボタンを追加。
//  v3: 登録済みメールの判定、確認メール再送、パスワード再設定、¥3,300（税込）
// ══════════════════════════════════════════════════════════════
(function(){
  const REG_KEY  = 'kw_dojo_reg';        // 決済リダイレクトを跨ぐ保留状態
  const DONE_KEY = 'kw_dojo_reg_done';   // 登録完了情報（招待コード再表示用）
  const PAID_TIERS = ['dojo','admin'];
  const PREFS = ['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県','鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'];

  let drUser = null;      // Supabase auth user
  let drProfile = null;   // user_profiles 行

  const DR_SUPABASE_URL = 'https://ocxyycuasswuztjkbwuf.supabase.co';
  const DR_SUPABASE_KEY = 'sb_publishable_fmCxA2UUUZtWdxwBhvhS5w_Z29KVTNp';
  // パスワード再設定メールのリンク先（観戦アプリv43以降で新パスワード入力画面を実装済み）
  const DR_RESET_REDIRECT = 'https://karate-spectator.vercel.app/';
  // 確認メールのリンク先 = このページ（Supabase の Redirect URLs に登録が必要）
  const DR_SELF_URL = location.origin + location.pathname;

  // メールのリンクから戻ってきたか（Supabaseクライアントが URL を消す前に読む）
  const DR_ARRIVAL = (function(){
    try{
      const h = new URLSearchParams((location.hash||'').replace(/^#/,''));
      const q = new URLSearchParams(location.search||'');
      const type = h.get('type') || q.get('type') || '';
      const err  = h.get('error_description') || q.get('error_description') || '';
      const code = h.get('error_code') || q.get('error_code') || '';
      if(err){
        // エラー付きの URL はクライアントが処理しないので自分で消す
        try{ history.replaceState(null,'',location.pathname); }catch(e){}
        return {kind:'error', type:type, code:code, message:err};
      }
      if(type==='signup' || type==='email' || type==='magiclink' || type==='invite') return {kind:'confirmed', type:type};
      return null;
    }catch(e){ return null; }
  })();

  function drIsMobile(){ try{ return window.matchMedia('(max-width: 700px)').matches || window.matchMedia('(pointer: coarse)').matches; }catch(e){ return false; } }
  let _drSb = null;
  function drSb(){
    if(_drSb) return _drSb;
    if(!window.supabase || !window.supabase.createClient)
      throw new Error('Supabaseライブラリを読み込めませんでした。ネットワーク接続を確認してください。');
    // implicit: メールアプリ内のブラウザなど、登録したのと別のブラウザでリンクを開いても確認が通る
    _drSb = window.supabase.createClient(DR_SUPABASE_URL, DR_SUPABASE_KEY, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, flowType:'implicit'}});
    return _drSb;
  }
  function drEsc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function drGet(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
  function drGetDoneList(){
    const v = drGet(DONE_KEY);
    if(!v) return [];
    if(Array.isArray(v)) return v;
    return v.invite_code ? [v] : [];
  }
  function drPushDone(entry){
    const list = drGetDoneList();
    const idx = list.findIndex(function(e){ return e.dojo_id===entry.dojo_id; });
    if(idx>=0) list[idx]=entry; else list.push(entry);
    drSet(DONE_KEY, list);
  }
  function drSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  function drDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
  function drTop(){ try{ document.querySelector('.panel-head').scrollIntoView({behavior:'smooth',block:'start'}); }catch(e){} }

  function drClose(){
    if(drGetDoneList().length>0){ drShowHistory(); }
    else { window.kwDojoRegOpen(); }
    try{ window.scrollTo({top:0, behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); }
  }
  function drStepbar(cur){
    const steps=['アカウント','道場情報','決済','完了'];
    const el=document.getElementById('kw-dr-stepbar');
    if(!el) return;
    el.innerHTML = steps.map(function(s,i){
      const n=i+1, cls = n<cur ? 'done' : n===cur ? 'cur' : '';
      return '<div class="step '+cls+'">'+s+'</div>';
    }).join('');
  }
  function drBody(html){ const b=document.getElementById('kw-dr-body'); if(b) b.innerHTML=html; }
  const MSG = '<div id="kw-dr-msg" class="msg"></div>';
  function drMsg(text, kind){
    const el=document.getElementById('kw-dr-msg');
    if(!el) return;
    el.textContent = text||'';
    el.className = 'msg ' + (kind==='err' ? 'err' : kind==='ok' ? 'ok' : 'info');
  }

  // ── プロファイル読み込み（なければfreeで作成） ──
  async function drLoadProfile(createIfMissing){
    if(!drUser) return null;
    const sb=drSb();
    let {data} = await sb.from('user_profiles').select('id, email, display_name, membership_tier').eq('id', drUser.id).maybeSingle();
    if(!data && createIfMissing){
      await sb.from('user_profiles').upsert({
        id: drUser.id,
        email: drUser.email,
        display_name: (drUser.user_metadata && drUser.user_metadata.display_name) || (drUser.email||'').split('@')[0],
        membership_tier: 'free'
      });
      const r2 = await sb.from('user_profiles').select('id, email, display_name, membership_tier').eq('id', drUser.id).maybeSingle();
      data = r2.data;
    }
    drProfile = data || null;
    return drProfile;
  }

  // ══ 入口 ══
  window.kwDojoRegOpen = async function(){
    // 確認メールから戻ったときは履歴より手続きを優先
    if(drGetDoneList().length > 0 && !DR_ARRIVAL){
      drShowHistory();
      return;
    }
    drStepbar(1); drBody('<div class="loading">確認中…</div>');
    try{
      const sb=drSb();
      const {data} = await sb.auth.getSession();
      if(data && data.session){
        drUser = data.session.user;
        await drLoadProfile(true);
        drShowInfoStep();
        if(DR_ARRIVAL && DR_ARRIVAL.kind==='confirmed'){
          const b=document.getElementById('kw-dr-body');
          if(b) b.insertAdjacentHTML('afterbegin','<div class="msg ok" style="margin:0 0 12px;">メールアドレスの確認が完了し、ログインしました。続けて道場の情報を入力してください。</div>');
        }
      } else {
        drShowAuthStep('login');
        if(DR_ARRIVAL && DR_ARRIVAL.kind==='error'){
          const expired = /expired|invalid/i.test(DR_ARRIVAL.message+' '+DR_ARRIVAL.code);
          drMsg(expired
            ? 'メールのリンクの有効期限が切れているか、すでに使われています。\nメールアドレスとパスワードでログインしてください。ログインできない場合は「新規登録」から確認メールを再送できます。'
            : 'メールのリンクを確認できませんでした（'+DR_ARRIVAL.message+'）。\nメールアドレスとパスワードでログインしてください。','err');
        }else if(DR_ARRIVAL && DR_ARRIVAL.kind==='confirmed'){
          drMsg('メールアドレスの確認が完了しました。登録したメールアドレスとパスワードでログインしてください。','ok');
        }
      }
    }catch(e){
      drShowAuthStep('login');
    }
  };

  // ══ Step1: アカウント ══
  function drShowAuthStep(tab){
    drStepbar(1);
    const su = tab==='signup';
    drBody(
      '<div class="tabs">'+
        '<button id="kw-dr-tab-login" type="button" class="tab'+(su?'':' on')+'">ログイン</button>'+
        '<button id="kw-dr-tab-signup" type="button" class="tab'+(su?' on':'')+'">新規登録</button>'+
      '</div>'+
      (su ?
        '<label class="f" for="kw-dr-name">代表者のお名前</label>'+
        '<input id="kw-dr-name" class="i" type="text" autocomplete="name">' : '')+
      '<label class="f" for="kw-dr-email">メールアドレス</label>'+
      '<input id="kw-dr-email" class="i" type="email" autocomplete="username" inputmode="email">'+
      '<label class="f" for="kw-dr-pwd">パスワード'+(su?' <span class="opt">（8文字以上）</span>':'')+'</label>'+
      '<input id="kw-dr-pwd" class="i" type="password" autocomplete="'+(su?'new-password':'current-password')+'">'+
      MSG+
      '<button id="kw-dr-go" type="button" class="btn main">'+(su?'アカウントを作成する':'ログインして次へ')+'</button>'+
      (su ? '' : '<button id="kw-dr-forgot" type="button" class="btn link">パスワードを忘れた方はこちら</button>')+
      '<div class="note">'+(su
        ? '登録すると確認メールが届きます。メールのリンクを開くと、このページに戻って手続きの続きに進みます。'
        : '観戦アプリ・カメラアプリと共通のアカウントです。お持ちでない方は「新規登録」を押してください。')+'</div>'
    );
    document.getElementById('kw-dr-tab-login').onclick = function(){ drShowAuthStep('login'); };
    document.getElementById('kw-dr-tab-signup').onclick = function(){ drShowAuthStep('signup'); };
    document.getElementById('kw-dr-go').onclick = su ? drDoSignup : drDoLogin;
    const fg=document.getElementById('kw-dr-forgot'); if(fg) fg.onclick=drDoForgot;
  }

  async function drDoLogin(){
    const email=(document.getElementById('kw-dr-email').value||'').trim();
    const pwd=document.getElementById('kw-dr-pwd').value||'';
    if(!email||!pwd){ drMsg('メールアドレスとパスワードを入力してください','err'); return; }
    drMsg('ログイン中…');
    try{
      const sb=drSb();
      const {data,error}=await sb.auth.signInWithPassword({email,password:pwd});
      if(error) throw error;
      drUser=data.user;
      await drLoadProfile(true);
      drShowInfoStep();
    }catch(e){
      let m=e && e.message || String(e);
      if(/Invalid login credentials/i.test(m)) m='メールアドレスかパスワードが違います';
      else if(/Email not confirmed/i.test(m)) m='メールアドレスの確認が終わっていません。届いた確認メールのリンクを開いてください。';
      drMsg('ログインできませんでした: '+m,'err');
    }
  }

  async function drDoSignup(){
    const name=(document.getElementById('kw-dr-name').value||'').trim();
    const email=(document.getElementById('kw-dr-email').value||'').trim();
    const pwd=document.getElementById('kw-dr-pwd').value||'';
    if(!name||!email||!pwd){ drMsg('すべての項目を入力してください','err'); return; }
    if(pwd.length<8){ drMsg('パスワードは8文字以上にしてください','err'); return; }
    drMsg('登録中…');
    try{
      const sb=drSb();
      const {data,error}=await sb.auth.signUp({email,password:pwd,options:{
        data:{display_name:name},
        emailRedirectTo: DR_SELF_URL   // 確認メールのリンクをこのページに戻す
      }});
      if(error){
        if(/already registered|already exists/i.test(error.message||'')){ drShowAlreadyRegistered(email); return; }
        throw error;
      }
      // 登録済みメールの場合、Supabaseはエラーを返さず「成功」を装う（メールは送られない）。
      const ids = data && data.user && data.user.identities;
      if(!data.session && Array.isArray(ids) && ids.length===0){
        drShowAlreadyRegistered(email);
        return;
      }
      if(data.session){
        drUser=data.user;
        await drLoadProfile(true);
        drShowInfoStep();
      }else{
        drShowConfirmSent(email);
      }
    }catch(e){
      drMsg('登録できませんでした: '+(e&&e.message||e),'err');
    }
  }

  function drShowAlreadyRegistered(email){
    drShowAuthStep('login');
    const em=document.getElementById('kw-dr-email'); if(em) em.value=email;
    const pw=document.getElementById('kw-dr-pwd'); if(pw) pw.focus();
    drMsg('このメールアドレスはすでに登録されています（観戦アプリ・カメラアプリと共通のアカウント）。\nそのアカウントのパスワードでログインしてください。確認メールは送られません。','err');
  }

  // 確認メール送信済み画面（自動で切り替えず、ここに留まる）
  function drShowConfirmSent(email){
    drStepbar(1);
    drBody(
      '<div class="big-ico">📧</div>'+
      '<div class="done-title" style="color:var(--text);">確認メールを送りました</div>'+
      '<div class="box">送信先：<b style="word-break:break-all;">'+drEsc(email)+'</b></div>'+
      '<div class="steps-box"><div class="h">次にやること</div><ol>'+
        '<li>届いたメールの「メールアドレスを確認」のリンクを開く</li>'+
        '<li>このページが開くので、そのまま道場の情報を入力する</li>'+
      '</ol></div>'+
      '<div class="note">メールが届かないときは、迷惑メールフォルダも確認してください。リンクを開いてもこのページが開かないときは、この画面の「ログインへ進む」からログインしてください。</div>'+
      MSG+
      '<button id="kw-dr-resend" type="button" class="btn sub">確認メールを再送する</button>'+
      '<button id="kw-dr-go" type="button" class="btn sub">ログインへ進む</button>'
    );
    drTop();
    document.getElementById('kw-dr-go').onclick=function(){
      drShowAuthStep('login');
      const em=document.getElementById('kw-dr-email'); if(em) em.value=email;
    };
    document.getElementById('kw-dr-resend').onclick=async function(){
      drMsg('再送中…');
      try{
        const {error}=await drSb().auth.resend({type:'signup', email:email, options:{emailRedirectTo: DR_SELF_URL}});
        if(error) throw error;
        drMsg('確認メールを再送しました。','ok');
      }catch(e){
        let m=e&&e.message||String(e);
        if(/rate limit|seconds/i.test(m)) m='短時間に何度も送信できません。少し時間をおいてお試しください。';
        drMsg('再送できませんでした: '+m,'err');
      }
    };
  }

  async function drDoForgot(){
    const email=(document.getElementById('kw-dr-email').value||'').trim();
    if(!email){ drMsg('上の欄にメールアドレスを入力してから押してください','err'); return; }
    drMsg('送信中…');
    try{
      const {error}=await drSb().auth.resetPasswordForEmail(email,{redirectTo:DR_RESET_REDIRECT});
      if(error) throw error;
      drMsg('パスワード再設定のメールを送りました（登録済みのメールアドレスの場合）。\nメールのリンクから新しいパスワードを設定したあと、このページに戻ってログインしてください。','ok');
    }catch(e){
      let m=e&&e.message||String(e);
      if(/rate limit|seconds/i.test(m)) m='短時間に何度も送信できません。少し時間をおいてお試しください。';
      drMsg('送信できませんでした: '+m,'err');
    }
  }

  // 別のアカウントでログインし直す
  async function drSwitchAccount(){
    try{ await drSb().auth.signOut(); }catch(e){}
    drUser=null; drProfile=null;
    drShowAuthStep('login');
    drMsg('ログアウトしました。道場会員として使うアカウントでログインしてください。','info');
  }
  function drWhoHtml(){
    const nm = drProfile && drProfile.display_name || '';
    const em = drUser && drUser.email || drProfile && drProfile.email || '';
    return '<div class="who">ログイン中：<b>'+drEsc(nm)+(nm&&em?'（':'')+drEsc(em)+(nm&&em?'）':'')+'</b></div>'+
      '<button id="kw-dr-switch" type="button" class="btn link" style="margin-top:4px;">別のアカウントでログインし直す</button>';
  }
  function drBindWho(){ const b=document.getElementById('kw-dr-switch'); if(b) b.onclick=drSwitchAccount; }

  // ══ Step2: 道場情報 ══
  function drShowInfoStep(){
    drStepbar(2);
    const pending = drGet(REG_KEY) || {};
    drBody(
      drWhoHtml()+
      '<label class="f" for="kw-dr-dojo-name">道場名 <span class="opt">（必須）</span></label>'+
      '<input id="kw-dr-dojo-name" class="i" type="text" maxlength="100" placeholder="例：○○空手道場" value="'+drEsc(pending.name||'')+'">'+
      '<label class="f" for="kw-dr-pref">都道府県 <span class="opt">（任意）</span></label>'+
      '<select id="kw-dr-pref" class="i">'+
        '<option value="">選択してください</option>'+
        PREFS.map(function(p){ return '<option value="'+p+'"'+(pending.prefecture===p?' selected':'')+'>'+p+'</option>'; }).join('')+
      '</select>'+
      MSG+
      '<button id="kw-dr-go" type="button" class="btn main">次へ（お支払いの確認）</button>'+
      '<div class="note">登録した道場は、観戦アプリの「所属道場」の一覧に表示されます。発行される招待コードで、父兄・選手のみなさんが参加できます。</div>'
    );
    drBindWho();
    document.getElementById('kw-dr-go').onclick = function(){
      const name=(document.getElementById('kw-dr-dojo-name').value||'').trim();
      const pref=document.getElementById('kw-dr-pref').value||'';
      if(!name){ drMsg('道場名を入力してください','err'); return; }
      drSet(REG_KEY, {name:name, prefecture:pref, ts:Date.now()});
      drShowPayStep();
    };
  }

  // ══ Step3: 決済 ══
  async function drShowPayStep(){
    drStepbar(3);
    drBody('<div class="loading">会員の状態を確認中…</div>');
    try{ await drLoadProfile(false); }catch(e){}
    const tier = drProfile && drProfile.membership_tier;
    if(PAID_TIERS.indexOf(tier)>=0){ drFinalize(); return; }
    const reg = drGet(REG_KEY) || {};
    drBody(
      '<div class="box">'+
        '<div class="plan-row"><span class="plan-name">道場会員（毎月自動更新）</span>'+
        '<span class="plan-price">¥3,300<small>/月（税込）</small></span></div>'+
        '<div style="font-size:15px;color:var(--sub);margin-top:6px;">登録する道場：<b style="color:var(--text);">'+drEsc(reg.name||'')+'</b>'+(reg.prefecture?'（'+drEsc(reg.prefecture)+'）':'')+'</div>'+
      '</div>'+
      MSG+
      '<button id="kw-dr-go" type="button" class="btn main">お支払いへ進む（Stripe）</button>'+
      '<button id="kw-dr-back" type="button" class="btn sub">道場の情報を直す</button>'+
      '<button id="kw-dr-paid" type="button" class="btn link">お支払い済みの方はこちら（状態を再確認）</button>'+
      '<div class="note">カード決済の画面（Stripe）に移ります。お支払いが終わると、このページに自動で戻り、道場の登録と招待コードの発行を行います。</div>'
    );
    document.getElementById('kw-dr-go').onclick = drStartCheckout;
    document.getElementById('kw-dr-back').onclick = drShowInfoStep;
    document.getElementById('kw-dr-paid').onclick = async function(){
      drMsg('確認中…');
      try{
        await drLoadProfile(false);
        if(PAID_TIERS.indexOf(drProfile && drProfile.membership_tier)>=0){ drFinalize(); }
        else drMsg('まだお支払いが確認できません。お支払い直後の場合は1〜2分おいてもう一度お試しください。','err');
      }catch(e){ drMsg('確認できませんでした: '+(e&&e.message||e),'err'); }
    };
  }

  async function drStartCheckout(){
    if(!/^https?:/.test(location.protocol)){
      drMsg('お支払いはWeb公開版（https）でのみ利用できます。','err');
      return;
    }
    drMsg('お支払い画面を準備中…');
    try{
      const sb=drSb();
      const {data} = await sb.auth.getSession();
      if(!data || !data.session){ drMsg('ログインが必要です','err'); return; }
      const res = await fetch(DR_SUPABASE_URL+'/functions/v1/create-checkout', {
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+data.session.access_token,'apikey': DR_SUPABASE_KEY},
        body: JSON.stringify({ type:'subscription', plan:'dojo', return_url: DR_SELF_URL })
      });
      const result = await res.json();
      if(!res.ok || !result.url){
        drMsg('お支払い画面を開けませんでした: '+(result.error||('エラー('+res.status+')')),'err');
        return;
      }
      location.href = result.url;
    }catch(e){
      drMsg('通信エラー: '+(e&&e.message||e),'err');
    }
  }

  // ══ Step4: 道場作成＋招待コード発行 ══
  async function drFinalize(){
    drStepbar(4);
    const reg = drGet(REG_KEY);
    if(!reg || !reg.name){
      drBody('<div class="msg err">道場の情報が見つかりません。最初からやり直してください。</div>'+
        '<button id="kw-dr-go" type="button" class="btn main">最初に戻る</button>');
      document.getElementById('kw-dr-go').onclick = function(){ drStartNewRegistration(); };
      return;
    }
    drBody('<div class="loading">道場を登録しています…<br><span style="font-size:14px;font-weight:500;">（お支払い直後は少し時間がかかることがあります）</span></div>');
    try{
      const sb=drSb();
      let tier = null;
      for(let i=0;i<8;i++){
        await drLoadProfile(true);
        tier = drProfile && drProfile.membership_tier;
        if(PAID_TIERS.indexOf(tier)>=0) break;
        await new Promise(function(r){ setTimeout(r,2000); });
      }
      const {data} = await sb.auth.getSession();
      if(!data || !data.session) throw new Error('ログインが切れました。もう一度ログインしてください。');

      const res = await fetch(DR_SUPABASE_URL+'/functions/v1/register-dojo', {
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+data.session.access_token,'apikey': DR_SUPABASE_KEY},
        body: JSON.stringify({ name: reg.name, prefecture: reg.prefecture||'' })
      });
      const result = await res.json().catch(function(){ return {}; });

      if(!res.ok || !result.success){
        if(result && result.code==='NAME_TAKEN'){
          drBody(
            '<div class="msg err">同じ名前の道場がすでに登録されています。'+(result.error?'\n'+drEsc(result.error):'')+'</div>'+
            '<button id="kw-dr-go" type="button" class="btn main">道場名を変更する</button>'+
            '<div class="note">お支払いは完了しています。道場名を変えて登録し直しても、二重に請求されることはありません。</div>'
          );
          document.getElementById('kw-dr-go').onclick = drShowInfoStep;
          return;
        }
        if(result && result.code==='TIER_NOT_READY'){
          drBody(
            '<div class="msg info">お支払いの反映を待っています。\nお支払いから反映まで1〜2分かかることがあります。</div>'+
            '<button id="kw-dr-go" type="button" class="btn main">もう一度確認する</button>'
          );
          document.getElementById('kw-dr-go').onclick = drFinalize;
          return;
        }
        throw new Error(result.error || ('エラー('+res.status+')'));
      }

      const done = { dojo_id: result.dojo_id, dojo_name: result.dojo_name, invite_code: result.invite_code, registered_at: Date.now() };
      drPushDone(done);
      drDel(REG_KEY);
      try{
        localStorage.setItem('kw_dojo_id', String(result.dojo_id||''));
        const el=document.getElementById('c-dojo'); if(el){ el.value=String(result.dojo_id||''); }
        if(window.cfg) window.cfg.dojo = String(result.dojo_id||'');
      }catch(e){}
      drShowDone(done);
      if(result.invite_code_error){ drMsg('注意: '+result.invite_code_error, 'err'); }
    }catch(e){
      drBody(
        '<div class="msg err">道場を登録できませんでした。\n'+drEsc(e&&e.message||e)+'</div>'+
        '<button id="kw-dr-go" type="button" class="btn main">もう一度試す</button>'+
        '<div class="note">お支払いは完了している場合があります。もう一度試しても、二重に請求されることはありません（道場の登録だけをやり直します）。</div>'
      );
      document.getElementById('kw-dr-go').onclick = drFinalize;
    }
  }

  // ══ 完了画面（登録直後） ══
  function drShowDone(done){
    drStepbar(4);
    const mob = drIsMobile();
    drBody(
      '<div class="done-title">✓ 道場の登録が完了しました</div>'+
      drDojoCard(done)+
      MSG+
      '<div class="steps-box"><div class="h">次にやること</div><ol>'+
        (mob
          ? '<li>大会で使うパソコンで Karate Win を開き、設定画面の「🔄 道場一覧を更新」（ログインが必要）を押してから、「道場」の一覧で <b>'+drEsc(done.dojo_name||'')+'</b> を選んでください。</li>'
          : '<li>Karate Win の設定画面の「道場」で <b>'+drEsc(done.dojo_name||'')+'</b> が選ばれていることを確認してください。このパソコンでは自動で選ばれます。別のパソコンでは「🔄 道場一覧を更新」を押してから選んでください。</li>')+
        '<li>招待コードを父兄・選手のみなさんに配ってください（身元を確認してから渡してください）。</li>'+
        '<li>父兄・選手のみなさんは、観戦アプリの会員登録（または「道場に参加」）で <b>'+drEsc(done.dojo_name||'')+'</b> を選び、招待コードを入力します。</li>'+
      '</ol></div>'+
      (mob ? '' : '<a class="btn main" href="karate-all-in-one.html" style="display:flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;">Karate Win を開く</a>')+
      '<button id="kw-dr-new" type="button" class="btn sub">続けて別の道場を登録する</button>'+
      '<button id="kw-dr-ok" type="button" class="btn link">閉じる</button>'
    );
    drTop();
    drBindDojoCardActions();
    document.getElementById('kw-dr-ok').onclick=drClose;
    document.getElementById('kw-dr-new').onclick=drStartNewRegistration;
  }

  // ══ 履歴一覧（2回目以降に開いたとき） ══
  function drShowHistory(){
    drStepbar(4);
    const list = drGetDoneList().slice().reverse();
    const curId = (function(){ try{ return localStorage.getItem('kw_dojo_id')||''; }catch(e){ return ''; } })();
    drBody(
      '<div style="font-size:17px;font-weight:800;">この端末で登録した道場（'+list.length+'件）</div>'+
      list.map(function(d){ return drDojoCard(d, curId); }).join('')+
      MSG+
      '<button id="kw-dr-new" type="button" class="btn main">新しい道場を登録する</button>'
    );
    drBindDojoCardActions();
    document.getElementById('kw-dr-new').onclick=drStartNewRegistration;
  }

  function drDojoCard(done, curId){
    const isCur = curId && String(done.dojo_id)===String(curId);
    const showUse = !isCur && !drIsMobile();
    return (
      '<div class="dojo">'+
        '<div class="nm"><span style="flex:1;">'+drEsc(done.dojo_name||'')+'</span>'+(isCur&&!drIsMobile()?'<span class="badge">このPCで設定中</span>':'')+'</div>'+
        '<div class="code-lbl">招待コード</div>'+
        '<div class="row"><div class="code">'+drEsc(done.invite_code||'—')+'</div>'+
          '<button type="button" class="mini kw-dr-copy" data-code="'+drEsc(done.invite_code||'')+'">コピー</button>'+
          (showUse?'<button type="button" class="mini kw-dr-use" data-id="'+drEsc(done.dojo_id||'')+'">このPCの設定に使う</button>':'')+
        '</div>'+
        '<div class="id">道場ID：'+drEsc(done.dojo_id||'')+'</div>'+
      '</div>'
    );
  }

  function drBindDojoCardActions(){
    document.querySelectorAll('#kw-dr-body .kw-dr-copy').forEach(function(btn){
      btn.onclick=function(){
        try{
          navigator.clipboard.writeText(String(btn.dataset.code||''));
          drMsg('招待コード '+btn.dataset.code+' をコピーしました','ok');
        }catch(e){ drMsg('コピーできませんでした。長押しして選択し、コピーしてください。','err'); }
      };
    });
    document.querySelectorAll('#kw-dr-body .kw-dr-use').forEach(function(btn){
      btn.onclick=function(){
        const id=String(btn.dataset.id||'');
        try{
          localStorage.setItem('kw_dojo_id', id);
          const el=document.getElementById('c-dojo'); if(el) el.value=id;
          if(window.cfg) window.cfg.dojo=id;
        }catch(e){}
        drShowHistory();
        setTimeout(function(){ drMsg('このパソコンの Karate Win の道場を切り替えました','ok'); },50);
      };
    });
  }

  async function drStartNewRegistration(){
    drDel(REG_KEY);
    drStepbar(1); drBody('<div class="loading">確認中…</div>');
    try{
      const sb=drSb();
      const {data}=await sb.auth.getSession();
      if(data && data.session){ drUser=data.session.user; await drLoadProfile(true); drShowInfoStep(); }
      else drShowAuthStep('login');
    }catch(e){ drShowAuthStep('login'); }
  }

  // ══ 決済リダイレクトからの復帰処理 ══
  function drHandleReturn(){
    let params;
    try{ params=new URLSearchParams(location.search); }catch(e){ return; }
    const co=params.get('checkout');
    if(!co) return;
    const reg=drGet(REG_KEY);
    if(!reg || !reg.name) return;
    try{
      params.delete('checkout'); params.delete('session_id');
      const q=params.toString();
      history.replaceState(null,'',location.pathname+(q?'?'+q:''));
    }catch(e){}
    if(co==='success'){
      drFinalize();
    }else{
      (async function(){
        try{
          const sb=drSb();
          const {data}=await sb.auth.getSession();
          if(data && data.session){ drUser=data.session.user; await drLoadProfile(true); }
        }catch(e){}
        drShowPayStep();
        setTimeout(function(){ drMsg('お支払いがキャンセルされました。続ける場合は「お支払いへ進む」を押してください。','err'); },50);
      })();
    }
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', function(){ setTimeout(drHandleReturn, 300); });
  }else{
    setTimeout(drHandleReturn, 300);
  }
})();

// ページ読み込み時にウィザードを自動起動（決済からの復帰処理が優先されるよう少し遅らせる）
(function(){
  function boot(){
    setTimeout(function(){
      var body=document.getElementById('kw-dr-body');
      if(body && body.textContent.indexOf('読み込み中')>=0) window.kwDojoRegOpen();
    }, 600);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
