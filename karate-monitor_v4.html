<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>観客モニター | Karate Win</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:#000;color:#e8eaf0;
  font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
  user-select:none}

/* ブラウザズーム・TV HDMI表示でも16:9を崩さない */
#root{
  background:#05080f;
  display:flex;flex-direction:column;
  overflow:hidden;
  position:fixed;top:0;left:50%;
  transform:translateX(-50%);
  /* JS resizeRoot() が width/height を px でセットする */
}

/* ─── HEADER ─── */
#header{
  flex-shrink:0;height:11%;
  display:flex;align-items:center;justify-content:center;
  background:#090d14;border-bottom:2px solid #1a3a6a;
  position:relative;padding:0 20px
}
#h-tournament{
  position:absolute;left:20px;
  font-size:2.0rem;font-weight:700;color:#6080b0;letter-spacing:0;
  white-space:nowrap;max-width:34%;line-height:1.15;
  /* JS fitTournament() が幅に応じてフォントを自動縮小し、全文を表示 */
}
#h-court{
  position:absolute;right:20px;
  font-size:2.2rem;color:#405070;white-space:nowrap
}
#h-cls{
  font-size:3.6rem;font-weight:900;color:#c8d8f8;letter-spacing:3px;
  text-align:center;padding:4px 6px;line-height:1.2
}

/* ─── MAIN 2カラム ─── */
#main{
  flex:1;display:grid;
  grid-template-columns:1fr 1fr;
  overflow:hidden;position:relative}

/* ─── 選手パネル（上/中/下 3分割） ─── */
.player-panel{
  display:flex;flex-direction:column;
  overflow:hidden;position:relative}
.player-panel.red-panel{
  background:linear-gradient(160deg,#130508 0%,#1c0a0d 60%,#0d0406 100%);
  border-right:1px solid #3a1020}
.player-panel.blue-panel{
  background:linear-gradient(200deg,#060a18 0%,#090e1e 60%,#040810 100%);
  border-left:1px solid #101830}

/* ══ 左右反転（操作画面の⇄と連動）: パネル位置と側面装飾のみ入替え ══ */
#main.flip .red-panel{
  order:2;
  border-right:none;border-left:1px solid #3a1020}
#main.flip .blue-panel{
  order:1;
  border-left:none;border-right:1px solid #101830}
/* タグ+ゼッケン行を鏡像に（ゼッケンが常に外側に来るように） */
#main.flip .red-panel  .p-tag-bib-row{flex-direction:row-reverse}
#main.flip .blue-panel .p-tag-bib-row{flex-direction:row-reverse}
#main.flip .red-panel  .p-bib{text-align:right}
#main.flip .blue-panel .p-bib{text-align:left}

/* 上1/3：タグ+ゼッケン・よみがな・氏名・所属 */
.p-top{
  flex:35;display:flex;flex-direction:column;align-items:center;
  justify-content:space-evenly;padding:0.8% 2% 0}
/* タグ＋ゼッケン 同一行 */
.p-tag-bib-row{
  width:96%;display:flex;align-items:center;flex-shrink:0}
.p-bib-spacer{flex:1}
.red-panel  .p-bib{flex:1;text-align:left}
.blue-panel .p-bib{flex:1;text-align:right}
/* 赤[左パネル]: [A01 左端] [赤 中央] [空白 右] */
/* 青[右パネル]: [空白 左] [青 中央] [A10 右端] */
.p-tag{
  font-size:2.2rem;font-weight:900;letter-spacing:5px;
  padding:4px 20px;border-radius:4px;flex-shrink:0}
.p-tag.r{background:#5a0018;color:#ffaaaa;border:1px solid #8a2030}
.p-tag.b{background:#0a1a50;color:#aaccff;border:1px solid #2040a0}
.p-bib{
  font-size:2.2rem;color:#aaa;font-weight:700;letter-spacing:3px;
  white-space:nowrap;flex-shrink:0;
  /* max 3文字固定 */
  min-width:4.5rem;text-align:center}
/* 名前グループ（よみがな＋名前を縦に束ねる） */
.p-name-group{
  display:flex;flex-direction:column;align-items:center;
  width:96%;flex-shrink:0}
.p-furi{
  font-size:1.9rem;color:#aaa;letter-spacing:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.3;text-align:center}
.p-name-wrap{
  width:96%;display:flex;align-items:center;justify-content:center;
  overflow:hidden;flex-shrink:0}
.p-name{
  font-size:5.5rem;font-weight:900;letter-spacing:2px;
  line-height:1.1;text-align:center;white-space:nowrap;
  display:inline-block}
.p-name.r{color:#fff;text-shadow:0 0 40px rgba(200,80,80,.7),0 2px 0 rgba(0,0,0,.6)}
.p-name.b{color:#fff;text-shadow:0 0 40px rgba(140,180,255,.7),0 2px 0 rgba(0,0,0,.6)}
.p-club{font-size:1.8rem;color:#666;flex-shrink:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90%}
/* 勝利バー（上/中の境界） */
.wbar{height:3px;width:90%;border-radius:2px;flex-shrink:0;
  background:transparent;transition:background .3s}
.wbar.win{background:linear-gradient(90deg,transparent,rgba(255,230,100,.9),transparent)}

/* 中1/3：合計スコア */
.p-mid{
  flex:38;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:0.3rem}
.p-score{
  font-size:16rem;font-weight:900;line-height:1;
  font-variant-numeric:tabular-nums;flex-shrink:0}
.p-score.r{color:#c01028;text-shadow:0 0 40px rgba(200,30,50,.4)}
.p-score.b{color:#1040c0;text-shadow:0 0 40px rgba(60,100,220,.4)}
.p-score.lead-r{color:#ff3355;
  text-shadow:0 0 60px rgba(255,50,80,.9),0 0 20px rgba(255,100,100,.6)}
.p-score.lead-b{color:#3366ff;
  text-shadow:0 0 60px rgba(80,130,255,.9),0 0 20px rgba(100,150,255,.6)}

/* ─── 先取バッジ（visibility で空間保持） ─── */
.sentoku-badge{
  font-size:1.8rem;font-weight:900;letter-spacing:3px;
  padding:3px 16px;border-radius:20px;
  flex-shrink:0;visibility:hidden}
.sentoku-badge.r{
  background:#5a0018;color:#ffcccc;
  border:2px solid #aa2040;box-shadow:0 0 14px rgba(200,30,50,.5)}
.sentoku-badge.b{
  background:#0a1a50;color:#ccddff;
  border:2px solid #2060c0;box-shadow:0 0 14px rgba(60,120,220,.5)}
.sentoku-badge.show{visibility:visible}

/* 下1/3：内訳スコア */
.p-bot{
  flex:27;display:flex;align-items:center;
  justify-content:center;padding:0 2% 1%}
.score-detail{
  display:flex;gap:0;align-items:center}
.sd-group{
  display:flex;gap:2.0rem;align-items:flex-end}
.sd-pen-block{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  border-left:1px solid #2a2a3a;padding-left:1.8rem;margin-left:1.8rem}
.sd-item{
  display:flex;flex-direction:column;align-items:center;gap:3px}
.sd-lbl{
  font-size:2.4rem;font-weight:700;letter-spacing:2px;color:#557;white-space:nowrap}
.sd-val{
  font-size:6.0rem;font-weight:900;
  min-width:5.5rem;text-align:center;line-height:1;
  font-variant-numeric:tabular-nums}
.sd-val.r{color:#cc1830}
.sd-val.b{color:#1844c8}
.sd-pen-block .sd-lbl{font-size:2.4rem;color:#556}
.sd-pen-block .sd-val{
  font-size:6.8rem;font-weight:900;line-height:1;
  color:#556;font-variant-numeric:tabular-nums;
  min-width:5.5rem;text-align:center}

/* ─── 中央タイマー ─── */
#center{
  position:absolute;left:50%;
  top:58%;transform:translate(-50%,-50%);
  width:24%;
  display:flex;flex-direction:column;
  align-items:center;
  pointer-events:none;z-index:10}

#timer-wrap{
  background:rgba(4,6,12,.96);
  border:2px solid #1a3060;
  border-radius:14px;
  padding:3% 6%;
  display:flex;flex-direction:column;align-items:center;
  box-shadow:0 0 50px rgba(0,50,150,.35),inset 0 0 30px rgba(0,20,60,.5)}

#timer-display{
  font-size:10rem;font-weight:900;letter-spacing:1px;
  font-variant-numeric:tabular-nums;
  color:#c8d8f8;line-height:1;white-space:nowrap}
#td-dec{font-size:6.5rem;color:#6888b8}
#timer-display.warning{color:#ffaa22;text-shadow:0 0 24px rgba(255,160,30,.7)}
#timer-display.finished{color:#ff3344;text-shadow:0 0 24px rgba(255,50,60,.8)}

#status-label{
  font-size:1.6rem;font-weight:700;letter-spacing:4px;color:#2a3d58;
  margin-top:5px}

/* ─── 勝利バナー ─── */
#win-banner{
  display:none;
  position:absolute;top:11%;left:0;right:0;bottom:0;
  z-index:100;
  flex-direction:column;align-items:center;justify-content:center;
  gap:1.125rem;animation:glow-pulse 1s ease-in-out infinite alternate}
#win-banner.blue-win{
  background:linear-gradient(135deg,rgba(8,15,70,.97),rgba(4,8,40,.97));
  border-top:3px solid #2050c0}
#win-banner.red-win{
  background:linear-gradient(135deg,rgba(70,8,15,.97),rgba(40,4,8,.97));
  border-top:3px solid #c02040}
#wb-icon{font-size:11rem;filter:drop-shadow(0 0 20px #ffd700)}
#wb-name{font-size:8rem;font-weight:900;letter-spacing:4px;color:#fff;
  white-space:nowrap;max-width:92%;display:inline-block}
#wb-type{font-size:3.5rem;font-weight:700;letter-spacing:5px;color:#ffd700;
  text-shadow:0 0 20px rgba(255,215,0,.6)}
@keyframes glow-pulse{
  from{box-shadow:inset 0 0 80px rgba(255,215,0,.08)}
  to{box-shadow:inset 0 0 160px rgba(255,215,0,.22)}}

/* ─── 接続ステータス ─── */
#conn-status{
  position:fixed;bottom:6px;right:10px;
  font-size:11px;letter-spacing:1px;color:#304060;z-index:200}
#conn-status.connected{color:#30a060}
#conn-status.waiting{color:#807030;animation:blink .8s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
/* ════ インターバルオーバーレイ（モニター） ════ */
#m-interval-overlay{
  display:none;
  position:absolute;top:11%;left:0;right:0;bottom:0;
  background:rgba(30,35,45,.96);
  z-index:500;
  flex-direction:column;align-items:center;justify-content:center;gap:3rem;
}
#m-interval-overlay.on{display:flex;}
#m-iv-label{font-size:2.5rem;font-weight:700;letter-spacing:6px;color:#8090b0;}
#m-iv-display{
  font-size:min(32rem,25.875rem);font-weight:700;line-height:1;
  letter-spacing:-6px;color:#e8f0ff;font-variant-numeric:tabular-nums;
  text-shadow:0 0 80px rgba(100,150,255,.3);
}
#m-iv-display.warn{color:#ffaa22;text-shadow:0 0 60px rgba(255,160,30,.8);}
#m-iv-display.paused{opacity:.4;}

/* ════ 告知オーバーレイ（モニター） ════ */
#m-annc-overlay{
  display:none;
  position:absolute;top:11%;left:0;right:0;bottom:0;
  background:rgba(30,35,45,.96);
  z-index:600;
  flex-direction:column;align-items:center;justify-content:center;gap:2rem;
}
#m-annc-overlay.on{display:flex;}
#m-annc-cls{
  font-size:min(5rem,3.9375rem);font-weight:700;letter-spacing:4px;
  color:#8090b0;text-align:center;
}
#m-annc-main{
  font-size:min(20rem,18.0rem);font-weight:900;line-height:1;
  letter-spacing:2px;color:#e8f0ff;text-align:center;
  text-shadow:0 0 80px rgba(100,150,255,.3);
}
/* ════ 全画面案内オーバーレイ ════ */
#fs-hint{
  position:fixed;top:0;left:0;right:0;bottom:0;
  z-index:1000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;
  background:rgba(3,5,10,.72);
  cursor:pointer;
  transition:opacity .4s;
}
#fs-hint.hide{opacity:0;pointer-events:none;}
#fs-hint-icon{font-size:6rem;filter:drop-shadow(0 0 20px rgba(100,150,255,.4));}
#fs-hint-main{
  font-size:2.6rem;font-weight:900;letter-spacing:2px;color:#c8d8f8;text-align:center;
  text-shadow:0 0 30px rgba(100,150,255,.3);
}
#fs-hint-sub{
  font-size:1.4rem;font-weight:400;letter-spacing:1px;color:#6888b8;text-align:center;line-height:1.6;
}

/* ══ 形ビュー（内蔵・kata2/kata1兼用） ══ */
#kata-root{display:none;position:fixed;inset:0;background:#05080f;z-index:50;flex-direction:column}
#kata-root.on{display:flex}
#kt-header{flex-shrink:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:0.5625rem 2rem;background:#090d14;border-bottom:2px solid #1a3a6a;height:7.3125rem}
#kt-tour{font-size:2.0rem;font-weight:700;color:#6080b0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#kt-cls{font-size:3.2rem;line-height:1.2;font-weight:900;color:#c8d8f8;letter-spacing:.2rem;white-space:nowrap;text-align:center}
#kt-sp{}
#kt-main{flex:1;display:flex;min-height:0}
.kpnl{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:1.125rem 2rem;position:relative;min-width:0}
.kpnl.kblue{background:linear-gradient(160deg,#0a2060,#0d3090)}
.kpnl.kred{background:linear-gradient(160deg,#3a0015,#6b0020)}
#kt-main .kblue{order:1}#kt-main .kred{order:2}
#kt-main.flip .kblue{order:2}#kt-main.flip .kred{order:1}
#kata-root.solo .kblue{display:none}
.kp-tag{position:absolute;top:0.9rem;left:1.4rem;font-size:2.2rem;font-weight:900;letter-spacing:.3rem;
  padding:0.225rem 1.2rem;border-radius:.5rem;color:#fff}
.kblue .kp-tag{background:rgba(20,60,180,.55);border:2px solid rgba(120,160,255,.6)}
.kred .kp-tag{background:rgba(160,10,40,.55);border:2px solid rgba(255,120,140,.6)}
.kp-bib{position:absolute;top:0.9rem;right:1.6rem;font-size:3.2rem;font-weight:700;color:#fff;opacity:.9;letter-spacing:.2rem}
.kp-furi{font-size:2.6rem;color:#fff;opacity:.85;letter-spacing:.2rem;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96%}
.kp-name{font-size:9rem;font-weight:900;letter-spacing:.2rem;color:#fff;text-align:center;line-height:1.1;
  max-width:96%;overflow:hidden;text-shadow:0 0 3rem rgba(255,255,255,.35)}
#kata-root.solo .kp-name{font-size:11.5rem}
.kp-club{margin-top:0.5625rem;font-size:2.6rem;color:#fff;opacity:.8;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96%}
.kwinner{display:none;margin-top:1.6875rem;font-size:6rem;font-weight:900;letter-spacing:.5rem;color:#ffd700;
  text-shadow:0 0 2rem rgba(255,215,0,.9),0 0 6rem rgba(255,215,0,.5);
  animation:kwglow 1s ease-in-out infinite alternate}
.kwinner.on{display:block}
@keyframes kwglow{from{transform:scale(1)}to{transform:scale(1.06)}}
</style>
</head>
<body>
<div id="root">

  <div id="header">
    <div id="h-tournament">大会名未設定</div>
    <div id="h-cls">クラス / 学年</div>
    <div id="h-court">コート —</div>
  </div>

  <div id="main">

    <!-- 左: 赤 -->
    <div class="player-panel red-panel">
      <!-- 上1/3: タグ+ゼッケン / よみがな / 氏名 / 所属 -->
      <div class="p-top">
        <div class="p-tag-bib-row">
          <div class="p-bib" id="m-r-bib">—</div>
          <div class="p-tag r">赤</div>
          <div class="p-bib-spacer"></div>
        </div>
        <div class="p-name-group">
          <div class="p-furi" id="m-r-furi"></div>
          <div class="p-name-wrap" id="wrap-r"><span class="p-name r" id="m-r-name">赤山 太郎</span></div>
        </div>
        <div class="p-club" id="m-r-club">所属道場</div>
        <div class="wbar" id="m-r-wbar"></div>
      </div>
      <!-- 中1/3: 合計スコア -->
      <div class="p-mid">
        <div class="p-score r" id="m-r-tot">0</div>
        <div class="sentoku-badge r" id="m-r-sentoku">赤先取</div>
      </div>
      <!-- 下1/3: 内訳スコア -->
      <div class="p-bot">
        <div class="score-detail">
          <div class="sd-group">
            <div class="sd-item">
              <div class="sd-lbl">有効</div>
              <div class="sd-val r" id="m-r-y">0</div>
            </div>
            <div class="sd-item">
              <div class="sd-lbl">技有</div>
              <div class="sd-val r" id="m-r-w">0</div>
            </div>
            <div class="sd-item">
              <div class="sd-lbl">一本</div>
              <div class="sd-val r" id="m-r-i">0</div>
            </div>
          </div>
          <div class="sd-pen-block">
            <div class="sd-lbl">反則</div>
            <div class="sd-val" id="m-r-p">0</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 右: 青 -->
    <div class="player-panel blue-panel">
      <!-- 上1/3: タグ+ゼッケン / よみがな / 氏名 / 所属 -->
      <div class="p-top">
        <div class="p-tag-bib-row">
          <div class="p-bib-spacer"></div>
          <div class="p-tag b">青</div>
          <div class="p-bib" id="m-b-bib">—</div>
        </div>
        <div class="p-name-group">
          <div class="p-furi" id="m-b-furi"></div>
          <div class="p-name-wrap" id="wrap-b"><span class="p-name b" id="m-b-name">青木 次郎</span></div>
        </div>
        <div class="p-club" id="m-b-club">所属道場</div>
        <div class="wbar" id="m-b-wbar"></div>
      </div>
      <!-- 中1/3: 合計スコア -->
      <div class="p-mid">
        <div class="p-score b" id="m-b-tot">0</div>
        <div class="sentoku-badge b" id="m-b-sentoku">青先取</div>
      </div>
      <!-- 下1/3: 内訳スコア -->
      <div class="p-bot">
        <div class="score-detail">
          <div class="sd-group">
            <div class="sd-item">
              <div class="sd-lbl">有効</div>
              <div class="sd-val b" id="m-b-y">0</div>
            </div>
            <div class="sd-item">
              <div class="sd-lbl">技有</div>
              <div class="sd-val b" id="m-b-w">0</div>
            </div>
            <div class="sd-item">
              <div class="sd-lbl">一本</div>
              <div class="sd-val b" id="m-b-i">0</div>
            </div>
          </div>
          <div class="sd-pen-block">
            <div class="sd-lbl">反則</div>
            <div class="sd-val" id="m-b-p">0</div>
          </div>
        </div>
      </div>
    </div>

  </div><!-- /main -->

  <!-- 中央タイマー -->
  <div id="center">
    <div id="timer-wrap">
      <div id="timer-display"><span id="td-main">1:00</span><span id="td-dec"></span></div>
      <div id="status-label">READY</div>
    </div>
  </div>

  <!-- 勝利バナー -->
  <div id="win-banner">
    <div id="wb-icon">🏆</div>
    <div id="wb-name">—</div>
    <div id="wb-type">勝ち</div>
  </div>

  <!-- ════ インターバルオーバーレイ ════ -->

  <div id="kata-root">
    <div id="kt-header">
      <div id="kt-tour">大会名未設定</div>
      <div id="kt-cls">クラス / 学年</div>
      <div id="kt-sp"></div>
    </div>
    <div id="kt-main">
      <div class="kpnl kblue">
        <div class="kp-tag">青</div><div class="kp-bib" id="kb-bib">—</div>
        <div class="kp-furi" id="kb-furi"></div>
        <div class="kp-name" id="kb-name">—</div>
        <div class="kp-club" id="kb-club">所属道場</div>
        <div class="kwinner" id="kw-b">Winner</div>
      </div>
      <div class="kpnl kred">
        <div class="kp-tag">赤</div><div class="kp-bib" id="kr-bib">—</div>
        <div class="kp-furi" id="kr-furi"></div>
        <div class="kp-name" id="kr-name">—</div>
        <div class="kp-club" id="kr-club">所属道場</div>
        <div class="kwinner" id="kw-r">Winner</div>
      </div>
    </div>
  </div>
  <div id="m-interval-overlay">
    <div id="m-iv-label">インターバル</div>
    <div id="m-iv-display">—</div>
  </div>

  <!-- ════ 告知オーバーレイ ════ -->
  <div id="m-annc-overlay">
    <div id="m-annc-cls"></div>
    <div id="m-annc-main">決勝</div>
  </div>

</div>
<div id="conn-status" class="waiting">● 操作画面待機中...</div>

<!-- ════ 全画面案内オーバーレイ ════ -->
<div id="fs-hint">
  <div id="fs-hint-icon">🖥</div>
  <div id="fs-hint-main">画面をクリックすると全画面になります</div>
  <div id="fs-hint-sub">タイトルバー・アドレスバーが消え、大画面表示に最適化されます<br>（解除するには ESC キー）</div>
</div>

<script>
// ══ BroadcastChannel ══
const ch = new BroadcastChannel('karate-win-sync');
function _rw(){const r=document.getElementById('root');const w=r&&r.getBoundingClientRect().width;return w||window.innerWidth;}
// ══ 形モードはページ内で切替（全画面を維持するためページ遷移しない） ══
const connEl = document.getElementById('conn-status');
let connected = false;

// ── フィット処理のキャッシュ（同じ文字列なら再計算しない＝レイアウトスラッシング防止）──
// 送信は約10回/秒（setInterval 100ms）だが氏名・大会名は試合中ほぼ不変のため、
// 変化時のみ scrollWidth を用いた自動縮小を実行する。resizeRoot() 側で無効化して再計算。
let _fitRN=null, _fitBN=null, _fitTn=null, _fitWB=null;

ch.onmessage = (e) => {
  if (!connected) {
    connected = true;
    connEl.className = 'connected';
    connEl.textContent = '● 操作画面と接続中';
  }
  applyState(e.data);
};

// ══ 状態反映 ══
function applyState(st) {
  // ── 形ビュー（ページ内切替・全画面維持） ──
  {
    const kroot=document.getElementById('kata-root');
    const kmode=(st.mon_page==='kata2'||st.mon_page==='kata1');
    kroot.classList.toggle('on',kmode);
    kroot.classList.toggle('solo',st.mon_page==='kata1');
    if(kmode){
      document.getElementById('kt-main').classList.toggle('flip',!!st.flip);
      document.getElementById('kt-tour').textContent=st.tournament||'大会名未設定';
      document.getElementById('kt-cls').textContent=st.cls||'クラス / 学年';
      const kfit=(id,name)=>{const el=document.getElementById(id);const len=String(name||'').replace(/\s/g,'').length;
        let fs=(st.mon_page==='kata1')?11.5:9;
        if(len>10)fs*=0.57;else if(len>8)fs*=0.69;else if(len>6)fs*=0.83;
        el.style.fontSize=fs+'rem';el.textContent=name||'—';};
      kfit('kr-name',st.rn||'—');
      document.getElementById('kr-bib').textContent=(st.rbib||'').replace(/^No\.\s*/,'')||'—';
      document.getElementById('kr-furi').textContent=st.rfuri||'';
      document.getElementById('kr-club').textContent=st.rclub||'所属道場';
      kfit('kb-name',st.bn||'—');
      document.getElementById('kb-bib').textContent=(st.bbib||'').replace(/^No\.\s*/,'')||'—';
      document.getElementById('kb-furi').textContent=st.bfuri||'';
      document.getElementById('kb-club').textContent=st.bclub||'所属道場';
      document.getElementById('kw-r').className='kwinner'+(st.win_side==='red'?' on':'');
      document.getElementById('kw-b').className='kwinner'+(st.win_side==='blue'?' on':'');
    }
  }
  // 左右反転（操作画面の⇄と連動）
  document.getElementById('main').classList.toggle('flip', !!st.flip);

  const _tn = st.tournament || '大会名未設定';
  if(_tn !== _fitTn){ fitTournament(_tn); _fitTn = _tn; }
  setText('h-cls',        st.cls        || 'クラス / 学年');
  setText('h-court',      'コート ' + (st.court || '—'));

  const _rn = st.rn || '赤山 太郎';
  const _bn = st.bn || '青木 次郎';
  if(_rn !== _fitRN){ fitName('m-r-name', 'wrap-r', _rn); _fitRN = _rn; }
  if(_bn !== _fitBN){ fitName('m-b-name', 'wrap-b', _bn); _fitBN = _bn; }
  setText('m-r-bib',  (st.rbib||'').replace(/^No\.\s*/,'') || '—');
  setText('m-r-furi', st.rfuri || '');
  setText('m-r-club', st.rclub || '所属道場');
  setText('m-b-bib',  (st.bbib||'').replace(/^No\.\s*/,'') || '—');
  setText('m-b-furi', st.bfuri || '');
  setText('m-b-club', st.bclub || '所属道場');

  const rt = (st.sc_r_y||0)*1 + (st.sc_r_w||0)*2 + (st.sc_r_i||0)*3;
  const bt = (st.sc_b_y||0)*1 + (st.sc_b_w||0)*2 + (st.sc_b_i||0)*3;
  const rT = document.getElementById('m-r-tot');
  const bT = document.getElementById('m-b-tot');
  rT.textContent = rt;
  bT.textContent = bt;
  rT.className = 'p-score r' + (rt > bt ? ' lead-r' : '');
  bT.className = 'p-score b' + (bt > rt ? ' lead-b' : '');

  document.getElementById('m-r-wbar').className = 'wbar' + (rt > bt ? ' win' : '');
  document.getElementById('m-b-wbar').className = 'wbar' + (bt > rt ? ' win' : '');

  setText('m-r-y', st.sc_r_y || 0);
  setText('m-r-w', st.sc_r_w || 0);
  setText('m-r-i', st.sc_r_i || 0);
  setText('m-r-p', st.sc_r_p || 0);
  setText('m-b-y', st.sc_b_y || 0);
  setText('m-b-w', st.sc_b_w || 0);
  setText('m-b-i', st.sc_b_i || 0);
  setText('m-b-p', st.sc_b_p || 0);

  showSentoku('m-r-sentoku', st.sentoku_r);
  showSentoku('m-b-sentoku', st.sentoku_b);

  const tdM = document.getElementById('td-main');
  const tdD = document.getElementById('td-dec');
  const tdW = document.getElementById('timer-display');
  const fmt = st.timer_fmt || '1:00';
  const di  = fmt.indexOf('.');
  if (di >= 0) { tdM.textContent = fmt.slice(0, di); tdD.textContent = fmt.slice(di); }
  else         { tdM.textContent = fmt;               tdD.textContent = ''; }
  tdW.className = '';
  if (st.timer_state === 'finished')     tdW.classList.add('finished');
  else if (st.timer_state === 'warning') tdW.classList.add('warning');
  const sm = {Ready:'READY', Running:'計時中', Stopped:'一時停止', Finished:'終了'};
  setText('status-label', sm[st.status] || st.status || 'READY');

  // インターバルオーバーレイ
  const ivOv = document.getElementById('m-interval-overlay');
  const ivDisp = document.getElementById('m-iv-display');
  if(ivOv && ivDisp){
    if(st.interval_active){
      ivOv.classList.add('on');
      const ms = st.interval_ms||0;
      const sec = Math.ceil(ms/1000);
      const m = Math.floor(sec/60), s = sec%60;
      ivDisp.textContent = ms<=0 ? '0:00' : m+':'+(s<10?'0':'')+s;
      // 一時停止中は暗く
      if(st.interval_paused){
        ivDisp.className = 'paused';
      } else {
        ivDisp.className = ms<=10000&&ms>0 ? 'warn' : '';
      }
    } else {
      // interval_active が false になったら即座に非表示
      ivOv.classList.remove('on');
    }
  }

  // 告知オーバーレイ
  const anncOv = document.getElementById('m-annc-overlay');
  if(anncOv){
    if(st.annc_active){
      anncOv.classList.add('on');
      const clsEl=document.getElementById('m-annc-cls');
      const mainEl=document.getElementById('m-annc-main');
      if(clsEl)clsEl.textContent=st.annc_cls||'';
      if(mainEl)mainEl.textContent=st.annc_label||'';
    } else {
      anncOv.classList.remove('on');
    }
  }

  const banner = document.getElementById('win-banner');
  if (st.win_side) {
    banner.className   = st.win_side === 'blue' ? 'blue-win' : 'red-win';
    banner.style.display = 'flex';
    const _wn = st.win_name || '—';
    // 勝者氏名をバナー幅に収まるよう自動縮小（変化時のみ再計算）
    if(_wn !== _fitWB){ fitBannerName(_wn); _fitWB = _wn; }
    setText('wb-type', st.win_type || '勝ち');
  } else {
    banner.style.display = 'none';
    banner.className = '';
    _fitWB = null; // 次回表示時に再フィットさせる
  }
}

// ── 選手名：親幅に収まるようフォントサイズを自動縮小 ──
function fitName(nameId, wrapId, name) {
  const el   = document.getElementById(nameId);
  const wrap = document.getElementById(wrapId);
  if (!el || !wrap) return;
  el.textContent = name;

  const basePx  = _rw() * 0.055;   // 5.5rem
  const minPx   = _rw() * 0.025;   // 2.5rem（最小）
  const maxW    = wrap.clientWidth;

  el.style.fontSize = basePx + 'px';
  let fs = basePx;
  // scrollWidth > clientWidth の間、1pxずつ縮小
  while (el.scrollWidth > maxW && fs > minPx) {
    fs -= 1;
    el.style.fontSize = fs + 'px';
  }
}
// ── 大会名：ヘッダー左枠に収まるようフォントを自動縮小し、全文を表示 ──
function fitTournament(name) {
  const el = document.getElementById('h-tournament');
  if (!el) return;
  el.textContent = name;
  const basePx = _rw() * 0.020;   // 2.0rem（基準）
  const minPx  = _rw() * 0.011;   // 1.1rem（最小＝全文表示を優先）
  el.style.fontSize = basePx + 'px';
  let fs = basePx;
  while (el.scrollWidth > el.clientWidth && fs > minPx) {
    fs -= 0.5;
    el.style.fontSize = fs + 'px';
  }
}

// ── 勝者バナー氏名：バナー幅に収まるようフォントを自動縮小（改行・はみ出し防止）──
function fitBannerName(name) {
  const el = document.getElementById('wb-name');
  const banner = document.getElementById('win-banner');
  if (!el || !banner) return;
  el.textContent = name;
  const basePx = _rw() * 0.08;    // 8rem（基準）
  const minPx  = _rw() * 0.035;   // 3.5rem（最小）
  const maxW   = banner.clientWidth * 0.92;   // #wb-name max-width:92% に合わせる
  el.style.fontSize = basePx + 'px';
  let fs = basePx;
  while (el.scrollWidth > maxW && fs > minPx) {
    fs -= 1;
    el.style.fontSize = fs + 'px';
  }
}

function setText(id, val) {
  const el = document.getElementById(id);
  if (el) el.textContent = val;
}

function showSentoku(id, show) {
  const el = document.getElementById(id);
  if (!el) return;
  if (show) el.classList.add('show');
  else      el.classList.remove('show');
}

// ── レスポンシブ ──
function resizeRoot() {
  const root = document.getElementById('root');
  const vw = window.innerWidth, vh = window.innerHeight;
  if (vw / vh > 16 / 9) {
    root.style.height = '100%';
    root.style.width  = (vh * 16 / 9) + 'px';
  } else {
    root.style.width  = '100%';
    root.style.height = (vw * 9 / 16) + 'px';
  }
  // フォント基準(rem)を16:9ボックスの実幅に合わせる（横長・縦長でも崩れない）
  document.documentElement.style.fontSize=(root.getBoundingClientRect().width/100)+'px';
  // リサイズ後に名前を再フィット（vw基準が変わるため強制再計算＝キャッシュ無効化）
  _fitRN = _fitBN = _fitTn = _fitWB = null;
  requestAnimationFrame(() => {
    fitName('m-r-name', 'wrap-r', document.getElementById('m-r-name').textContent);
    fitName('m-b-name', 'wrap-b', document.getElementById('m-b-name').textContent);
    fitTournament(document.getElementById('h-tournament').textContent);
    // 勝者バナー表示中なら氏名も再フィット
    const banner = document.getElementById('win-banner');
    if (banner && banner.style.display !== 'none') {
      fitBannerName(document.getElementById('wb-name').textContent);
    }
  });
}
window.addEventListener('resize', resizeRoot);
resizeRoot();

setTimeout(() => {
  if (!connected)
    connEl.textContent = '● 未接続 — 同じChromeで操作画面も開いてください';
}, 8000);

// ══════════════════════════════════════
//  全画面（Fullscreen API）
//  画面クリックでブラウザUIごと全画面化
// ══════════════════════════════════════
(function(){
  const hint = document.getElementById('fs-hint');

  // クロスブラウザの全画面要求
  function requestFS(){
    const el = document.documentElement;
    const fn = el.requestFullscreen
            || el.webkitRequestFullscreen
            || el.mozRequestFullScreen
            || el.msRequestFullscreen;
    if(fn){
      try{ const p = fn.call(el); if(p && p.catch) p.catch(function(){}); }
      catch(e){}
    }
  }
  // 現在の全画面要素を取得
  function fsElement(){
    return document.fullscreenElement
        || document.webkitFullscreenElement
        || document.mozFullScreenElement
        || document.msFullscreenElement || null;
  }

  // クリック（またはタップ）で全画面化 → 案内を隠す
  function enterFS(){
    requestFS();
    if(hint) hint.classList.add('hide');
  }
  document.addEventListener('click', enterFS);
  document.addEventListener('touchend', enterFS, {passive:true});

  // 全画面が解除されたら案内を再表示（ESCなどで抜けた時）
  function onFSChange(){
    if(!hint) return;
    if(fsElement()) hint.classList.add('hide');
    else            hint.classList.remove('hide');
  }
  document.addEventListener('fullscreenchange', onFSChange);
  document.addEventListener('webkitfullscreenchange', onFSChange);
  document.addEventListener('mozfullscreenchange', onFSChange);
  document.addEventListener('MSFullscreenChange', onFSChange);
})();
</script>
</body>
</html>
